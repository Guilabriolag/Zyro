const RAMP_WIDTH = 5;
const THICK = .3;

const Z1 = 0;
const Z2 = RAMP_WIDTH;

function buildSideWall(
  x1, y1,
  x2, y2,
  zCenter,
  width
) {

  if (Math.max(y1, y2) <= .05)
    return;

  const shape = new THREE.Shape();

  shape.moveTo(x1, 0);
  shape.lineTo(x1, y1);
  shape.lineTo(x2, y2);
  shape.lineTo(x2, 0);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(
    shape,
    {
      depth: width,
      bevelEnabled: false
    }
  );

  const wall = new THREE.Mesh(
    geo,
    wallMat
  );

  wall.position.z =
    zCenter - width / 2;

  wall.castShadow = true;
  wall.receiveShadow = true;

  skateGroup.add(wall);
}


function segment(
  x1, y1, z1,
  x2, y2, z2,
  width = RAMP_WIDTH
) {

  const dx = x2 - x1;
  const dy = y2 - y1;
  const dz = z2 - z1;

  const len =
    Math.hypot(dx, dy, dz);

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(
      len,
      THICK,
      width
    ),
    concreteMat
  );

  mesh.position.set(
    (x1+x2)/2,
    (y1+y2)/2,
    (z1+z2)/2
  );

  mesh.rotation.z =
    Math.atan2(dy, dx);

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  skateGroup.add(mesh);

  buildSideWall(
    x1, y1,
    x2, y2,
    z1,
    width
  );
}


function curveUp(
  x0,
  y0,
  radius,
  angleDeg,
  z,
  dirX,
  segs = 14
) {

  const pts = [];

  const total =
    angleDeg * Math.PI / 180;

  for (
    let i = 0;
    i <= segs;
    i++
  ) {

    const t =
      (i / segs) * total;

    pts.push([
      x0 +
      dirX *
      radius *
      Math.sin(t),

      y0 +
      radius *
      (1 - Math.cos(t))
    ]);
  }

  for (
    let i = 0;
    i < segs;
    i++
  ) {

    segment(
      pts[i][0],
      pts[i][1],
      z,

      pts[i+1][0],
      pts[i+1][1],
      z
    );
  }

  return pts[segs];
}

// PISTA — DIMENSÕES
// ============================================================

const miniRampHeight = 3.6;
const miniRampRadius = 3.6;
const flatBottomLength = 4.5;
const topFlat = 3;
const runCaixote = 2;

const X_BACK_LIMIT = -16;

// PISTA — LADO 1
// ============================================================

  0,
  miniRampRadius,
  95,
  Z1,
  1
);

  xMini1,
  0,
  Z1,
  xMini2,
  0,
  Z1
);

    xMini2,
    0,
    miniRampRadius,
    95,
    Z1,
    -1
  );

  xMini1,
  miniRampHeight,
  Z1,
  xMini1 + 3,
  miniRampHeight,
  Z1
);

const plateau1 =
  topMini1[0] - 3.5;

  topMini1[0],
  miniRampHeight,
  Z1,
  plateau1,
  miniRampHeight,
  Z1
);

const ramp45End =
  plateau1 - miniRampHeight;

segment(
  plateau1,
  miniRampHeight,
  Z1,
  ramp45End,
  0,
  Z1
);

const caixoteStart =
  ramp45End - 4;

segment(
  ramp45End,
  0,
  Z1,
  caixoteStart,
  0,
  Z1
);

const caixoteTopStart =
  caixoteStart - runCaixote;

const caixoteTopEnd =
  caixoteTopStart - topFlat;

const caixoteDown =
  caixoteTopEnd - runCaixote;

segment(
  caixoteStart,
  0,
  Z1,
  caixoteTopStart,
  hipHeight,
  Z1
);

segment(
  caixoteTopStart,
  hipHeight,
  Z1,
  caixoteTopEnd,
  hipHeight,
  Z1
);

segment(
  caixoteTopEnd,
  hipHeight,
  Z1,
  caixoteDown,
  0,
  Z1
);

const quarterBase =
  caixoteDown - 4.5;

segment(
  caixoteDown,
  0,
  Z1,
  quarterBase,
  0,
  Z1
);


// Curva final

const radius90 = 4.5;

for (
  let i = 0;
  i < 12;
  i++
) {

  const a1 =
    (i/12) *
    Math.PI/2;

  const a2 =
    ((i+1)/12) *
    Math.PI/2;

  segment(
    quarterBase -
    radius90 *
    Math.sin(a1),

    radius90 *
    (1-Math.cos(a1)),

    Z1,

    quarterBase -
    radius90 *
    Math.sin(a2),

    radius90 *
    (1-Math.cos(a2)),

    Z1
  );
}

segment(
  quarterBase-radius90,
  radius90,
  Z1,

  X_BACK_LIMIT,
  radius90,
  Z1
);


// ============================================================
// PISTA — LADO 2
// ============================================================

curveUp(
  xMini1,
  0,
  miniRampRadius,
  95,
  Z2,
  1
);

segment(

  Z2,
  xMini2,
  0,
  Z2
);

const topMini2 =

    xMini2,
    0,
    miniRampRadius,
    95,
    Z2,
    -1
  );

segment(
  xMini1,
  miniRampHeight,
  Z2,
  xMini1 + 3,
  miniRampHeight,
  Z2
);

const plateau2 =

segment(
  topMini2[0],
  miniRampHeight,
  Z2,
  plateau2,
  miniRampHeight,
  Z2
);


// Curva de descida

for (
  let i = 0;
  i < 12;
  i++
) {

  const a1 =
    (i/12) *
    Math.PI/2;

  const a2 =
    ((i+1)/12) *
    Math.PI/2;

  segment(
    plateau2 -
    miniRampRadius *
    (1-Math.cos(a1)),

    miniRampHeight -
    miniRampRadius *
    Math.sin(a1),

    Z2,

    plateau2 -
    miniRampRadius *
    (1-Math.cos(a2)),

    miniRampHeight -
    miniRampRadius *
    Math.sin(a2),

    Z2
  );
}

const dropBottom =
  plateau2 - miniRampRadius;

segment(

  0,
  Z2,

  caixoteStart,
  0,
  Z2
);

segment(
  caixoteStart,
  0,
  Z2,

  caixoteTopStart,
  hipHeight,

);

);

function addGymEquipment(

) {

  const g =
    new THREE.Group();

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .07,
        .07,
        1.8,
        10
      ),
      gymMat
    );

  pole.position.y =
    .9;

  g.add(pole);


  if (type === "twister") {

    const disc1 =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .35,
          .35,
          .07,
          16
        ),
        gymMat
      );

    disc1.position.set(
      -.45,
      .12,
      0
    );

    const disc2 =
      disc1.clone();

    disc2.position.x =
      .45;

    g.add(

  } else {

    const bar =

          .1

        gymMat
      );

    bar.position.y =
      1.5;

    g.add(bar);
  }


  g.position.set(
    x,
    0,
    z
  );

  gymGroup.add(g);
}

// ============================================================
// ALAMBRADO BAIXO
// ============================================================

const LOW_H = 1.15;

function lowFence(
  x1,
  z1,
  x2,
  z2
) {

  const dx =
    x2-x1;

  const dz =
    z2-z1;

  const len =
    Math.hypot(dx,dz);

  const panel =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        len,
        LOW_H,
        .06
      ),
      fenceLowMat
    );

  panel.position.set(
    (x1+x2)/2,
    LOW_H/2,
    (z1+z2)/2
  );

  panel.rotation.y =
    Math.atan2(dz,dx);

  fenceGroup.add(panel);


  // Corrimão

  const rail =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .035,
        .035,
        len,
        8
      ),
      metalMat
    );

  rail.rotation.z =
    Math.PI/2;

  rail.rotation.y =
    Math.atan2(dz,dx);

  rail.position.set(
    (x1+x2)/2,
    LOW_H,
    (z1+z2)/2
  );

  fenceGroup.add(rail);


  // Postes a cada ~2.5m

  const count =
    Math.max(
      1,
      Math.ceil(len/2.5)
    );

  for (
    let i = 0;
    i <= count;
    i++
  ) {

    const t =
      i/count;

    const px =
      x1 + dx*t;

    const pz =
      z1 + dz*t;

    const post =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .045,
          .045,
          LOW_H,
          8
        ),
        metalMat
      );

    post.position.set(
      px,
      LOW_H/2,
      pz
    );

    fenceGroup.add(post);
  }
}

function addBench(

) {

  const g =

      ),

    );

  const back =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        .4,
        .07
      ),
      benchMat
    );

  back.position.set(
    0,
    .7,
    -.22
  );

  g.add(back);


  [-.8,.8].forEach(
    px => {

      const leg =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .08,
            .45,
            .45
          ),
          metalMat
        );

      leg.position.set(
        px,
        .22,

      );

      g.add(leg);
    }
  );


  g.position.set(
    x,
    0,
    z
  );

  g.rotation.y =
    rotation;

  landscapeGroup.add(g);
}
