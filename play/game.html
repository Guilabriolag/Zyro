<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0e14"
  >

  <title>ZYRO — Complexo Esportivo</title>

  <!-- ======================================================
       CSS PRINCIPAL
       ====================================================== -->

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- ======================================================
       CAMADA DO JOGO
       ====================================================== -->

  <main id="game-shell">

    <!-- Three.js será inserido aqui pelo game.js -->

  </main>


  <!-- ======================================================
       HUD
       ====================================================== -->

  <div id="hud-top">

    <div id="hud-title">
      <b>ZYRO</b>
      <span>· complexo esportivo</span>
    </div>

    <div id="hud-status">
      <span id="player-status">
        online
      </span>
    </div>

  </div>


  <!-- ======================================================
       BOTÃO DE MENU
       ====================================================== -->

  <button
    id="menu-btn"
    type="button"
    aria-label="Abrir menu"
  >
    ☰
  </button>


  <!-- ======================================================
       MENU / PAUSE
       ====================================================== -->

  <section
    id="pause-menu"
    aria-hidden="true"
  >

    <div id="pause-panel">

      <div class="pause-header">

        <div>
          <small>ZYRO</small>
          <h1>PAUSADO</h1>
        </div>

        <button
          id="pause-close"
          type="button"
          aria-label="Fechar"
        >
          ×
        </button>

      </div>


      <div class="pause-options">

        <button
          id="resume-btn"
          class="menu-option primary"
          type="button"
        >
          ▶ Continuar
        </button>

        <button
          id="character-btn"
          class="menu-option"
          type="button"
        >
          🧍 Personagem
        </button>

        <button
          id="settings-btn"
          class="menu-option"
          type="button"
        >
          ⚙ Configurações
        </button>

        <button
          id="world-btn"
          class="menu-option"
          type="button"
        >
          🌎 Mundo
        </button>

      </div>


      <div class="pause-footer">

        <span>
          ZYRO Sandbox
        </span>

        <span>
          v0.1
        </span>

      </div>

    </div>

  </section>


  <!-- ======================================================
       JOYSTICK
       ====================================================== -->

  <div
    id="joy-zone"
    aria-label="Joystick"
  >

    <div id="joy-base"></div>

    <div id="joy-knob"></div>

  </div>


  <!-- ======================================================
       BOTÃO DE INTERAÇÃO
       ====================================================== -->

  <button
    id="action-btn"
    type="button"
  >
    interagir
  </button>


  <!-- ======================================================
       BOTÃO DE PULO
       ====================================================== -->

  <button
    id="jump-btn"
    type="button"
  >
    ↑
  </button>


  <!-- ======================================================
       TOAST
       ====================================================== -->

  <div
    id="event-toast"
    aria-live="polite"
  ></div>


  <!-- ======================================================
       CAMADA DE INFORMAÇÕES DO JOGADOR
       ====================================================== -->

  <div id="player-panel">

    <div class="player-panel-title">
      PLAYER
    </div>

    <div class="player-stat">
      <span>posição</span>
      <strong id="player-position">
        0 / 0 / 0
      </strong>
    </div>

    <div class="player-stat">
      <span>estado</span>
      <strong id="player-state">
        normal
      </strong>
    </div>

  </div>


  <!-- ======================================================
       THREE.JS
       ====================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>


  <!-- ======================================================
       CONTROLES
       ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
  </script>


  <!-- ======================================================
       GAME
       ====================================================== -->

  <script src="./game.js"></script>


  <!-- ======================================================
       WORLD
       ====================================================== -->

  <script src="./world.js"></script>


  <!-- ======================================================
       CONTROLLER DO CONTAINER
       ====================================================== -->

  <script>

    (() => {

      "use strict";


      // ------------------------------------------------------
      // ELEMENTOS
      // ------------------------------------------------------

      const menuBtn =
        document.getElementById("menu-btn");

      const pauseMenu =
        document.getElementById("pause-menu");

      const pauseClose =
        document.getElementById("pause-close");

      const resumeBtn =
        document.getElementById("resume-btn");

      const characterBtn =
        document.getElementById("character-btn");

      const settingsBtn =
        document.getElementById("settings-btn");

      const worldBtn =
        document.getElementById("world-btn");


      // ------------------------------------------------------
      // ABRIR PAUSE
      // ------------------------------------------------------

      function openPause() {

        pauseMenu.classList.add("open");

        pauseMenu.setAttribute(
          "aria-hidden",
          "false"
        );

        if (
          window.ZYRO &&
          typeof window.ZYRO.pause ===
          "function"
        ) {

          if (
            !window.ZYRO.getState().paused
          ) {

            window.ZYRO.pause();

          }

        }

      }


      // ------------------------------------------------------
      // FECHAR PAUSE
      // ------------------------------------------------------

      function closePause() {

        pauseMenu.classList.remove(
          "open"
        );

        pauseMenu.setAttribute(
          "aria-hidden",
          "true"
        );

        if (
          window.ZYRO &&
          typeof window.ZYRO.pause ===
          "function"
        ) {

          if (
            window.ZYRO.getState().paused
          ) {

            window.ZYRO.pause();

          }

        }

      }


      // ------------------------------------------------------
      // MENU
      // ------------------------------------------------------

      menuBtn.addEventListener(
        "click",
        () => {

          if (
            pauseMenu.classList.contains(
              "open"
            )
          ) {

            closePause();

          } else {

            openPause();

          }

        }
      );


      pauseClose.addEventListener(
        "click",
        closePause
      );


      resumeBtn.addEventListener(
        "click",
        closePause
      );


      // ------------------------------------------------------
      // ESC
      // ------------------------------------------------------

      window.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Escape"
          ) {

            if (
              pauseMenu.classList.contains(
                "open"
              )
            ) {

              closePause();

            } else {

              openPause();

            }

          }

        }
      );


      // ------------------------------------------------------
      // PERSONAGEM
      // ------------------------------------------------------

      characterBtn.addEventListener(
        "click",
        () => {

          if (
            typeof window.ZYRO_CHARACTER_OPEN ===
            "function"
          ) {

            window.ZYRO_CHARACTER_OPEN();

          } else {

            showToast(
              "Sistema de personagem será conectado no próximo módulo."
            );

          }

        }
      );


      // ------------------------------------------------------
      // CONFIGURAÇÕES
      // ------------------------------------------------------

      settingsBtn.addEventListener(
        "click",
        () => {

          showToast(
            "Configurações serão conectadas depois."
          );

        }
      );


      // ------------------------------------------------------
      // MUNDO
      // ------------------------------------------------------

      worldBtn.addEventListener(
        "click",
        () => {

          showToast(
            "Editor do mundo será conectado depois."
          );

        }
      );


      // ------------------------------------------------------
      // TOAST
      // ------------------------------------------------------

      function showToast(
        message
      ) {

        const toast =
          document.getElementById(
            "event-toast"
          );

        if (!toast)
          return;

        toast.textContent =
          message;

        toast.classList.add(
          "show"
        );

        clearTimeout(
          showToast.timer
        );

        showToast.timer =
          setTimeout(
            () => {

              toast.classList.remove(
                "show"
              );

            },
            2500
          );

      }


      // ------------------------------------------------------
      // ATUALIZA HUD DO PLAYER
      // ------------------------------------------------------

      function updateHUD() {

        if (
          !window.ZYRO ||
          !window.ZYRO.player
        ) {

          requestAnimationFrame(
            updateHUD
          );

          return;

        }


        const player =
          window.ZYRO.player;


        const position =
          document.getElementById(
            "player-position"
          );

        const state =
          document.getElementById(
            "player-state"
          );


        if (position) {

          position.textContent =
            `${player.x.toFixed(1)} / ` +
            `${player.y.toFixed(1)} / ` +
            `${player.z.toFixed(1)}`;

        }


        if (state) {

          state.textContent =
            player.grounded
              ? "no chão"
              : "no ar";

        }


        requestAnimationFrame(
          updateHUD
        );

      }


      updateHUD();


      // ------------------------------------------------------
      // PULO
      // ------------------------------------------------------

      const jumpBtn =
        document.getElementById(
          "jump-btn"
        );


      if (jumpBtn) {

        jumpBtn.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            if (
              window.ZYRO &&
              window.ZYRO.player
            ) {

              // O game.js lerá este comando
              // no próximo ciclo.

              window.ZYRO.getState()
                .input.jump = true;

            }

          }
        );

      }


      // ------------------------------------------------------
      // INFORMAÇÃO DE BOOT
      // ------------------------------------------------------

      window.addEventListener(
        "load",
        () => {

          console.log(
            "ZYRO — container iniciado."
          );

          console.log(
            "ZYRO WORLD:",
            window.ZYRO_WORLD
          );

        }
      );

    })();

  </script>

</body>
</html>
