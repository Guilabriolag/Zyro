<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ZYRO — Shopping / Girospin</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111217;
      color: #fffef2;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111217;
    }

    .hidden {
      display: none !important;
    }

    .loading-box {
      text-align: center;
      letter-spacing: 2px;
    }

    .loading-box h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .loading-box p {
      margin: 0;
      opacity: .6;
      font-size: 12px;
    }

    /* =====================================================
       HUD
    ===================================================== */

    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      pointer-events: none;
    }

    .hud-card {
      background: rgba(10, 11, 14, .78);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 10px;
      padding: 9px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .25);
    }

    #zyro-title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    #zyro-subtitle {
      margin-top: 3px;
      font-size: 9px;
      opacity: .55;
      letter-spacing: 1px;
    }

    /* =====================================================
       GIROSPIN HUD
    ===================================================== */

    #girospin-hud {
      position: absolute;
      top: 75px;
      left: 12px;

      min-width: 190px;

      background: rgba(3, 3, 3, .78);
      border: 1px solid rgba(76, 201, 240, .28);
      border-radius: 10px;

      padding: 10px 12px;

      backdrop-filter: blur(8px);

      pointer-events: none;
    }

    #girospin-label {
      color: #4cc9f0;
      font-size: 9px;
      letter-spacing: 2px;
    }

    #girospin-intent {
      margin-top: 5px;
      color: #f1c66a;
      font-size: 12px;
      font-weight: bold;
    }

    #girospin-help {
      margin-top: 6px;
      color: #aaa;
      font-size: 9px;
      line-height: 1.4;
    }

    /* =====================================================
       INTERAÇÃO
    ===================================================== */

    #interaction-panel {
      position: absolute;

      left: 50%;
      bottom: 24px;

      transform: translateX(-50%);

      width: min(360px, calc(100% - 32px));

      background: rgba(8, 9, 12, .86);
      border: 1px solid rgba(255, 255, 255, .13);

      border-radius: 14px;

      padding: 12px 14px;

      text-align: center;

      backdrop-filter: blur(10px);

      pointer-events: none;
    }

    #interaction-icon {
      font-size: 20px;
      margin-bottom: 3px;
    }

    #interaction-title {
      font-size: 14px;
      font-weight: bold;
    }

    #interaction-description {
      margin-top: 3px;
      font-size: 10px;
      opacity: .6;
    }

    /* =====================================================
       BOTÕES
    ===================================================== */

    .button {
      position: fixed;
      z-index: 30;

      border: 1px solid rgba(255, 255, 255, .16);

      background: rgba(15, 16, 20, .85);

      color: white;

      border-radius: 50%;

      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, .35);

      user-select: none;
    }

    .button:active {
      transform: scale(.94);
    }

    #menu-button {
      top: 12px;
      right: 12px;
    }

    #pause-button {
      top: 76px;
      right: 12px;
    }

    #character-button {
      top: 140px;
      right: 12px;
    }

    #action-btn {
      right: 24px;
      bottom: 110px;

      background: rgba(217, 154, 50, .88);

      color: #111;

      font-weight: bold;
    }

    /* =====================================================
       JOYSTICK
    ===================================================== */

    #joystick-area {
      position: fixed;

      left: 24px;
      bottom: 90px;

      width: 130px;
      height: 130px;

      z-index: 30;

      pointer-events: auto;
    }

    #joystick-base {
      position: absolute;

      left: 15px;
      top: 15px;

      width: 100px;
      height: 100px;

      border-radius: 50%;

      background: rgba(255, 255, 255, .07);

      border: 1px solid rgba(255, 255, 255, .14);
    }

    #joystick-stick {
      position: absolute;

      left: 40px;
      top: 40px;

      width: 50px;
      height: 50px;

      border-radius: 50%;

      background: rgba(255, 255, 255, .18);

      border: 1px solid rgba(255, 255, 255, .2);
    }

    /* =====================================================
       PAINÉIS
    ===================================================== */

    .panel {
      position: fixed;
      inset: 0;

      z-index: 90;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, .65);

      backdrop-filter: blur(8px);
    }

    .panel-box {
      width: min(360px, calc(100% - 32px));

      background: #181a20;

      border: 1px solid rgba(255, 255, 255, .14);

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .45);
    }

    .panel-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .panel-row {
      display: flex;
      justify-content: space-between;

      padding: 9px 0;

      border-bottom: 1px solid rgba(255, 255, 255, .07);

      font-size: 12px;
    }

    .panel-row span:first-child {
      opacity: .55;
    }

    .panel-close {
      margin-top: 18px;

      width: 100%;

      border: 0;

      padding: 12px;

      border-radius: 9px;

      background: #d99a32;

      color: #111;

      font-weight: bold;
    }

    /* =====================================================
       MENU
    ===================================================== */

    #main-menu .menu-buttons {
      display: grid;
      gap: 9px;
    }

    .menu-item {
      width: 100%;

      padding: 13px;

      border: 1px solid rgba(255, 255, 255, .1);

      border-radius: 9px;

      background: #22252d;

      color: white;

      text-align: left;
    }

    /* =====================================================
       PAUSE
    ===================================================== */

    #pause-screen .panel-box {
      text-align: center;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      #girospin-hud {
        top: 72px;
        left: 10px;
      }

      #interaction-panel {
        bottom: 18px;
      }

      #action-btn {
        right: 18px;
        bottom: 105px;
      }

      #joystick-area {
        left: 15px;
        bottom: 82px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       GAME
  ====================================================== -->

  <div id="game-container"></div>


  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div id="loading-screen" class="screen">

    <div class="loading-box">

      <h1>ZYRO</h1>

      <p>CARREGANDO TERRITÓRIO...</p>

    </div>

  </div>


  <!-- =====================================================
       HUD
  ====================================================== -->

  <div id="hud">

    <div id="top-bar">

      <div class="hud-card">

        <div id="zyro-title">
          ZYRO
        </div>

        <div id="zyro-subtitle">
          TERRITÓRIO VIVO
        </div>

      </div>

    </div>


    <!-- GIROSPIN -->

    <div id="girospin-hud">

      <div id="girospin-label">
        GIROSPIN · CAMPO
      </div>

      <div id="girospin-intent">
        QUERER: COMPRAR CAMISETA
      </div>

      <div id="girospin-help">
        E / AÇÃO → emitir impulso<br>
        1 camiseta · 2 skate · 3 empréstimo · 4 celular
      </div>

    </div>


    <!-- INTERAÇÃO POI -->

    <div id="interaction-panel">

      <div id="interaction-icon">
        •
      </div>

      <div id="interaction-title">
        Nada por perto
      </div>

      <div id="interaction-description">
        Explore o shopping
      </div>

    </div>

  </div>


  <!-- =====================================================
       BOTÕES
  ====================================================== -->

  <button
    id="menu-button"
    class="button"
    type="button"
  >
    ☰
  </button>

  <button
    id="pause-button"
    class="button"
    type="button"
  >
    II
  </button>

  <button
    id="character-button"
    class="button"
    type="button"
  >
    ●
  </button>

  <button
    id="action-btn"
    class="button"
    type="button"
  >
    E
  </button>


  <!-- =====================================================
       JOYSTICK
  ====================================================== -->

  <div id="joystick-area">

    <div id="joystick-base"></div>

    <div id="joystick-stick"></div>

  </div>


  <!-- =====================================================
       PAUSE
  ====================================================== -->

  <div
    id="pause-screen"
    class="panel hidden"
  >

    <div class="panel-box">

      <div class="panel-title">
        PAUSADO
      </div>

      <button
        id="resume-button"
        class="menu-item"
        type="button"
      >
        Continuar
      </button>

      <button
        id="character-button-pause"
        class="menu-item"
        type="button"
      >
        Personagem
      </button>

    </div>

  </div>


  <!-- =====================================================
       MENU PRINCIPAL
  ====================================================== -->

  <div
    id="main-menu"
    class="panel hidden"
  >

    <div class="panel-box">

      <div class="panel-title">
        ZYRO
      </div>

      <div class="menu-buttons">

        <button
          class="menu-item"
          data-menu="continue"
          type="button"
        >
          Continuar
        </button>

        <button
          class="menu-item"
          data-menu="character"
          type="button"
        >
          Personagem
        </button>

      </div>

      <button
        id="close-main-menu"
        class="panel-close"
        type="button"
      >
        Fechar
      </button>

    </div>

  </div>


  <!-- =====================================================
       PERSONAGEM
  ====================================================== -->

  <div
    id="player-panel"
    class="panel hidden"
  >

    <div class="panel-box">

      <div class="panel-title">
        PERSONAGEM
      </div>

      <div class="panel-row">

        <span>
          Posição
        </span>

        <span id="character-position">
          0 / 0
        </span>

      </div>

      <div class="panel-row">

        <span>
          Piso
        </span>

        <span id="character-floor">
          Térreo
        </span>

      </div>

      <div class="panel-row">

        <span>
          Campo
        </span>

        <span>
          GIROSPIN
        </span>

      </div>

      <button
        id="close-player-panel"
        class="panel-close"
        type="button"
      >
        Fechar
      </button>

    </div>

  </div>


  <!-- =====================================================
       THREE.JS
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
  </script>
<script>
  <script>
<script>
  document.getElementById("loading-screen").style.display = "none";
  alert("HTML ESTÁ EXECUTANDO");
</script>
  
</script>

  <!-- =====================================================
       ZYRO ENGINE
       IMPORTANTE: ORDEM
  ====================================================== -->

  <script src="js/game.js"></script>
<script src="js/world.js"></script>
<script src="js/poi.js"></script>
<script src="js/ui.js"></script>
<script src="js/girospin.js"></script>
  <!-- =====================================================
       BOOT EXTRA
       Garante que o HUD do Girospin acompanhe a intenção.
  ====================================================== -->

  <script>

    window.addEventListener("load", () => {

      const intentEl =
        document.getElementById("girospin-intent");

      if (!intentEl) return;

      setInterval(() => {

        if (
          window.ZYRO_GIROSPIN &&
          typeof window.ZYRO_GIROSPIN.getIntent === "function"
        ) {

          const intent =
            window.ZYRO_GIROSPIN.getIntent();

          intentEl.textContent =
            `QUERER: ${intent.action} ${intent.entity}`;

        }

      }, 150);

    });

  </script>

</body>
</html>
