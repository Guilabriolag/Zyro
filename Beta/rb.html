<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estação Comercial 3D — White Label</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #05050a;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* =========================================================
           HUD ORIGINAL
        ========================================================= */

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            transition: opacity .25s ease, transform .25s ease;
        }

        #hud.immersion-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 .logo-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
        }

        button:hover {
            background: rgba(255,255,255,0.2);
        }

        button.active {
            color: #1a1a1a;
        }

        /* =========================================================
           INSTRUÇÕES
        ========================================================= */

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.7);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,.1);
            z-index: 10;
            text-align: center;
        }

        #instructions.immersion-hidden {
            display: none;
        }

        /* =========================================================
           LOADER
        ========================================================= */

        #loader {
            position: absolute;
            inset: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity .5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,.1);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loader p {
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* =========================================================
           MODO IMERSÃO
        ========================================================= */

        #immersion-toggle {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(10,10,15,.88);
            backdrop-filter: blur(12px);
            color: white;
            font-size: 27px;
            z-index: 40;
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
            padding: 0;
        }

        #immersion-toggle.active {
            background: var(--immersion-accent, #ffbc0d);
            color: #111;
        }

        #immersion-ui {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        #immersion-ui.active {
            display: block;
        }

        /* Botão sair */

        #exit-immersion {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(10,10,15,.8);
            border: 1px solid rgba(255,255,255,.2);
            color: white;
            font-size: 20px;
            pointer-events: auto;
            padding: 0;
        }

        /* Botão câmera */

        #camera-mode-button {
            position: fixed;
            right: 18px;
            bottom: 96px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(10,10,15,.82);
            border: 1px solid rgba(255,255,255,.2);
            color: white;
            font-size: 22px;
            pointer-events: auto;
            padding: 0;
        }

        /* Indicador */

        #camera-mode-label {
            position: fixed;
            right: 20px;
            bottom: 157px;
            background: rgba(0,0,0,.65);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            padding: 5px 9px;
            font-size: 10px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* =========================================================
           JOYSTICK
        ========================================================= */

        #joystick-zone {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 180px;
            height: 180px;
            z-index: 35;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-base {
            position: absolute;
            left: 30px;
            bottom: 30px;
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 2px solid rgba(255,255,255,.18);
            box-shadow:
                inset 0 0 20px rgba(255,255,255,.04),
                0 8px 25px rgba(0,0,0,.35);
        }

        #joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 52px;
            margin-left: -26px;
            margin-top: -26px;
            border-radius: 50%;
            background: rgba(255,255,255,.38);
            border: 2px solid rgba(255,255,255,.35);
            box-shadow: 0 4px 15px rgba(0,0,0,.3);
            transition: transform .08s ease;
        }

        /* =========================================================
           CROSSHAIR / STATUS
        ========================================================= */

        #immersion-status {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 7px 13px;
            border-radius: 15px;
            background: rgba(0,0,0,.55);
            border: 1px solid rgba(255,255,255,.1);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            margin-left: -2.5px;
            margin-top: -2.5px;
            border-radius: 50%;
            background: rgba(255,255,255,.6);
            box-shadow: 0 0 8px rgba(255,255,255,.4);
            pointer-events: none;
        }

        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 600px) {
            #hud {
                top: 10px;
                left: 10px;
                padding: 14px;
                max-width: 250px;
                transform: scale(.9);
                transform-origin: top left;
            }

            #instructions {
                display: none;
            }

            #immersion-toggle {
                right: 14px;
                bottom: 14px;
            }

            #joystick-zone {
                width: 170px;
                height: 170px;
            }
        }
    </style>
</head>

<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="loader-text">CONSTRUINDO ESTAÇÃO 3D...</p>
</div>

<div id="canvas-container"></div>

<!-- =============================================================
     HUD ORIGINAL
============================================================= -->

<div id="hud">

    <h1>
        <span class="logo-dot" id="logo-dot"></span>
        <span id="hud-title">—</span>
    </h1>

    <h2 id="hud-slogan">—</h2>

    <div class="section-title">Ambiente & Horário</div>

    <div class="btn-group">
        <button id="btn-day" class="active">☀ Dia</button>
        <button id="btn-night">🌙 Noite</button>
    </div>

    <div class="section-title">Controle de Câmera</div>

    <div class="btn-group">
        <button id="btn-cam-ext" class="active">Fachada</button>
        <button id="btn-cam-int">Interior</button>
        <button id="btn-cam-drive">Entrada</button>
        <button id="btn-cam-totem">Totem</button>
    </div>

    <div class="section-title">Animação</div>

    <button id="btn-orbit" style="width:100%;">
        🔄 Rotacionar Câmera (On)
    </button>
</div>

<div id="instructions">
    Use o <b>Botão Esquerdo</b> para girar •
    <b>Botão Direito</b> para arrastar •
    <b>Scroll</b> para Zoom
</div>

<!-- =============================================================
     BOTÃO DE ENTRADA DO MODO IMERSÃO
============================================================= -->

<button id="immersion-toggle" aria-label="Modo Imersão">
    🎮
</button>

<!-- =============================================================
     INTERFACE IMERSIVA
============================================================= -->

<div id="immersion-ui">

    <div id="immersion-status">
        MODO IMERSÃO
    </div>

    <div id="camera-mode-label">
        3ª pessoa
    </div>

    <div id="crosshair"></div>

    <button id="camera-mode-button">
        📷
    </button>

    <button id="exit-immersion">
        ✕
    </button>

    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

    // =====================================================================
    // STATION_CONFIG
    // =====================================================================

    const STATION_CONFIG = {

        brand: {
            name: "Labriolag",
            monogram: "L",
            title: "Labriolag",
            slogan: "Laboratório de Ideias Influentes",
            secondarySign: "CET Studio",
            entrySignLabel: "ENTRADA",
            menuBoardLabel: "CATÁLOGO",
            pageTitle: "Labriolag — Estação 3D",
            loaderText: "CONSTRUINDO LABRIOLAG 3D..."
        },

        theme: {
            primary: "#ffbc0d",
            secondary: "#2f7dfb",
            facade: "#18181c",
            wood: "#c19a6b",
            trim: "#f0f0f2",
            glass: "#ffffff",
            interiorFloor: "#dedede",
            counterTop: "#ffffff",
            road: "#222225",
            grass: "#3b5e2b",
            vehicle: "#2f7dfb"
        },

        fontFamily: '"Segoe UI", Arial, sans-serif',

        features: {
            driveThru: true,
            entryTotem: true,
            exteriorOrnament: false,
            outdoorSeating: false,
            booths: true,
            highTable: true,
            roundTables: true
        }
    };


    // =====================================================================
    // VARIÁVEIS DO MOTOR
    // =====================================================================

    const container = document.getElementById('canvas-container');

    let scene;
    let camera;
    let renderer;
    let controls;

    let buildingGroup;
    let furnitureGroup;
    let lightGroup;
    let environmentGroup;
    let vehicleGroup;

    let clock = new THREE.Clock();

    let isNight = false;
    let autoRotate = true;
    let dayNightTransition = 0.0;

    let carSpline;
    let carMesh;
    let carProgress = 0;

    let hemiLight;
    let dirLight;

    let streetLights = [];
    let interiorSpotlights = [];
    let neonMaterials = [];
    let skyMesh;


    // =====================================================================
    // ESTADO DO MODO IMERSÃO
    // =====================================================================

    let immersionMode = false;

    let cameraMode = "third";

    let playerGroup;
    let playerDirection = 0;
    let playerSpeed = 4.0;

    let playerVelocity = new THREE.Vector3();

    let joystickVector = {
        x: 0,
        y: 0
    };

    let npcGroup;

    const npcs = [];


    // =====================================================================
    // CONFIGURAÇÃO DA INTERFACE
    // =====================================================================

    function applyConfigToDOM() {

        const c = STATION_CONFIG;

        document.title = c.brand.pageTitle;

        document.getElementById('loader-text').textContent =
            c.brand.loaderText;

        document.getElementById('hud-title').textContent =
            c.brand.title;

        document.getElementById('hud-slogan').textContent =
            c.brand.slogan;

        document.getElementById('logo-dot').style.background =
            c.theme.primary;

        document.documentElement.style.setProperty(
            '--immersion-accent',
            c.theme.primary
        );

        const styleTag = document.createElement('style');

        styleTag.textContent = `
            body {
                font-family: ${c.fontFamily};
            }

            h1 {
                color: ${c.theme.primary};
            }

            h2 {
                color: ${c.theme.secondary};
            }

            button:hover {
                border-color: ${c.theme.primary};
            }

            button.active {
                background: ${c.theme.primary};
                border-color: ${c.theme.primary};
                box-shadow: 0 0 10px ${c.theme.primary}66;
            }

            .spinner {
                border-top-color: ${c.theme.primary};
            }

            #loader p {
                color: ${c.theme.primary};
            }
        `;

        document.head.appendChild(styleTag);
    }


    // =====================================================================
    // INIT
    // =====================================================================

    function init() {

        applyConfigToDOM();

        scene = new THREE.Scene();

        scene.fog = new THREE.FogExp2(
            0x1a1a24,
            0.015
        );


        // ---------------------------------------------------------------
        // CAMERA
        // ---------------------------------------------------------------

        camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(
            28,
            12,
            35
        );


        // ---------------------------------------------------------------
        // RENDERER
        // ---------------------------------------------------------------

        renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;

        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;

        renderer.toneMappingExposure = 1.0;

        container.appendChild(
            renderer.domElement
        );


        // ---------------------------------------------------------------
        // ORBIT CONTROLS
        // ---------------------------------------------------------------

        controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        controls.maxPolarAngle =
            Math.PI / 2 - 0.05;

        controls.minDistance = 3;
        controls.maxDistance = 80;

        controls.target.set(
            0,
            3,
            0
        );


        // ---------------------------------------------------------------
        // GRUPOS
        // ---------------------------------------------------------------

        buildingGroup = new THREE.Group();
        furnitureGroup = new THREE.Group();
        lightGroup = new THREE.Group();
        environmentGroup = new THREE.Group();
        vehicleGroup = new THREE.Group();

        npcGroup = new THREE.Group();

        scene.add(
            buildingGroup,
            furnitureGroup,
            lightGroup,
            environmentGroup,
            vehicleGroup,
            npcGroup
        );


        // ---------------------------------------------------------------
        // MUNDO
        // ---------------------------------------------------------------

        createEnvironment();
        createBuilding();
        createInterior();
        createLogosAndSigns();

        if (STATION_CONFIG.features.driveThru) {
            createDriveThruCar();
        }

        setupLights();


        // ---------------------------------------------------------------
        // PLAYER
        // ---------------------------------------------------------------

        createPlayer();


        // ---------------------------------------------------------------
        // NPCS
        // ---------------------------------------------------------------

        createNPCs();


        // ---------------------------------------------------------------
        // UI
        // ---------------------------------------------------------------

        setupUI();
        setupJoystick();


        window.addEventListener(
            'resize',
            onWindowResize
        );


        // ---------------------------------------------------------------
        // LOADER
        // ---------------------------------------------------------------

        setTimeout(() => {

            const loader =
                document.getElementById('loader');

            loader.style.opacity = 0;

            setTimeout(() => {
                loader.remove();
            }, 500);

        }, 1000);


        animate();
    }


    // =====================================================================
    // TEXTURA DE TEXTO
    // =====================================================================

    function createTextTexture(
        text,
        textColor,
        bgColor,
        fontSize = 48
    ) {

        const canvas =
            document.createElement('canvas');

        canvas.width = 512;
        canvas.height = 128;

        const ctx =
            canvas.getContext('2d');

        ctx.fillStyle = bgColor;
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.font =
            `bold ${fontSize}px ${STATION_CONFIG.fontFamily}`;

        ctx.fillStyle = textColor;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor = textColor;
        ctx.shadowBlur = 10;

        ctx.fillText(
            text,
            canvas.width / 2,
            canvas.height / 2
        );

        return new THREE.CanvasTexture(canvas);
    }


    // =====================================================================
    // LOGO
    // =====================================================================

    function createLogoBadge(scale = 1) {

        const group =
            new THREE.Group();

        const theme =
            STATION_CONFIG.theme;


        const plateMat =
            new THREE.MeshStandardMaterial({
                color: theme.facade,
                roughness: 0.3,
                metalness: 0.6
            });


        const plate =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    1.1,
                    1.1,
                    0.25,
                    32
                ),
                plateMat
            );

        plate.rotation.x =
            Math.PI / 2;

        plate.castShadow = true;

        group.add(plate);


        const ringMat =
            new THREE.MeshStandardMaterial({
                color: theme.primary,
                emissive: theme.primary,
                emissiveIntensity: 0,
                roughness: 0.2,
                metalness: 0.7
            });

        neonMaterials.push(ringMat);


        const ring =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    1.1,
                    0.08,
                    12,
                    32
                ),
                ringMat
            );

        group.add(ring);


        const monoTex =
            createTextTexture(
                STATION_CONFIG.brand.monogram,
                theme.primary,
                "rgba(0,0,0,0)",
                90
            );


        const monoMat =
            new THREE.MeshBasicMaterial({
                map: monoTex,
                transparent: true
            });


        const monoPlane =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    1.6,
                    1.6
                ),
                monoMat
            );

        monoPlane.position.z = 0.14;

        group.add(monoPlane);


        group.scale.set(
            scale,
            scale,
            scale
        );

        return group;
    }


    // =====================================================================
    // AMBIENTE
    // =====================================================================

    function createEnvironment() {

        const theme =
            STATION_CONFIG.theme;


        const floor =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    100,
                    100
                ),
                new THREE.MeshStandardMaterial({
                    color: theme.road,
                    roughness: 0.8,
                    metalness: 0.1
                })
            );

        floor.rotation.x =
            -Math.PI / 2;

        floor.receiveShadow = true;

        environmentGroup.add(floor);


        if (STATION_CONFIG.features.driveThru) {

            const lineGeo =
                new THREE.RingGeometry(
                    18,
                    18.5,
                    64,
                    1,
                    0,
                    Math.PI * 1.5
                );

            const lineMat =
                new THREE.MeshBasicMaterial({
                    color: theme.primary,
                    side: THREE.DoubleSide
                });

            const driveLaneLine =
                new THREE.Mesh(
                    lineGeo,
                    lineMat
                );

            driveLaneLine.rotation.x =
                Math.PI / 2;

            driveLaneLine.position.set(
                0,
                0.02,
                0
            );

            environmentGroup.add(
                driveLaneLine
            );
        }


        const curb =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    26,
                    0.3,
                    18
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x888890,
                    roughness: 0.6
                })
            );

        curb.position.set(
            0,
            0.15,
            0
        );

        curb.receiveShadow = true;

        environmentGroup.add(curb);


        const grass =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    8,
                    0.3,
                    18
                ),
                new THREE.MeshStandardMaterial({
                    color: theme.grass,
                    roughness: 0.9
                })
            );

        grass.position.set(
            17,
            0.15,
            0
        );

        grass.receiveShadow = true;

        environmentGroup.add(grass);


        for (let i = 0; i < 3; i++) {
            createTree(
                17,
                0.3,
                -6 + i * 6
            );
        }


        createStreetLight(
            10,
            0,
            10
        );

        createStreetLight(
            -10,
            0,
            -10
        );


        const skyGeo =
            new THREE.SphereGeometry(
                150,
                32,
                15
            );

        const skyMat =
            new THREE.MeshBasicMaterial({
                color: 0x5075a6,
                side: THREE.BackSide
            });

        skyMesh =
            new THREE.Mesh(
                skyGeo,
                skyMat
            );

        scene.add(skyMesh);
    }


    // =====================================================================
    // ÁRVORE
    // =====================================================================

    function createTree(x, y, z) {

        const treeGroup =
            new THREE.Group();

        treeGroup.position.set(
            x,
            y,
            z
        );


        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.15,
                    0.25,
                    2,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x5a3d28,
                    roughness: 0.9
                })
            );

        trunk.position.y = 1;
        trunk.castShadow = true;

        treeGroup.add(trunk);


        const leavesMat =
            new THREE.MeshStandardMaterial({
                color: 0x2e5c1e,
                roughness: 0.8,
                flatShading: true
            });


        const leaves1 =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    1.2,
                    2,
                    6
                ),
                leavesMat
            );

        leaves1.position.y = 2.5;
        leaves1.castShadow = true;

        treeGroup.add(leaves1);


        const leaves2 =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    0.9,
                    1.5,
                    6
                ),
                leavesMat
            );

        leaves2.position.y = 3.5;
        leaves2.castShadow = true;

        treeGroup.add(leaves2);


        environmentGroup.add(
            treeGroup
        );
    }


    // =====================================================================
    // POSTE
    // =====================================================================

    function createStreetLight(x, y, z) {

        const poleGroup =
            new THREE.Group();

    function createHighTable(x, y, z) {

        const tableGroup =
            new THREE.Group();

        );


        const woodMat =
            new THREE.MeshStandardMaterial({
                color: 0x8b5a2b,

                    0.08,
                    3

        top.position.y = 1.6;
        top.castShadow = true;

        tableGroup.add(top);


        [
            [-0.6, -1.3],

            [0.6, 1.3]

        for (let i = -1; i <= 1; i++) {

            createStool(

            );
        }


        furnitureGroup.add(
            tableGroup
        );
    }

        carSpline =
            new THREE.CatmullRomCurve3([
                new THREE.Vector3(18, 0, 18),
                new THREE.Vector3(18, 0, -18),
                new THREE.Vector3(-18, 0, -18),
                new THREE.Vector3(-18, 0, 18),
                new THREE.Vector3(0, 0, 18)
            ], true);


        carMesh = carGroup;

        vehicleGroup.add(
            carMesh
        );
    }

    // =====================================================================
    // COLISÃO
    //
    // Não usamos física pesada.
    // São caixas simples representando as paredes principais.
    // =====================================================================

    const collisionBoxes = [

        // Parede traseira
        {
            minX: -11.3,
            maxX: 11.3,
            minZ: -7.9,
            maxZ: -7.2
        },

        // Parede direita
        {
            minX: 10.7,
            maxX: 11.3,
            minZ: -7.5,
            maxZ: 7.5
        },

        // Parede esquerda traseira
        {
            minX: -11.3,
            maxX: -10.7,
            minZ: -7.5,
            maxZ: -3
        },

        // Madeira frontal esquerda
        {
            minX: -11.1,
            maxX: -5.9,
            minZ: 7.2,
            maxZ: 7.9
        }
    ];


    function collidesAt(x, z) {

        const radius = 0.38;


        for (const box of collisionBoxes) {

            const nearestX =
                Math.max(
                    box.minX,
                    Math.min(x, box.maxX)
                );

            const nearestZ =
                Math.max(
                    box.minZ,
                    Math.min(z, box.maxZ)
                );


            const dx =
                x - nearestX;

            const dz =
                z - nearestZ;


            if (
                dx * dx +
                dz * dz <
                radius * radius
            ) {
                return true;
            }
        }


        return false;
    }


    // =====================================================================
    // MOVIMENTO DO PLAYER
    // =====================================================================

    function updatePlayer(delta) {

        if (!immersionMode) {
            return;
        }


        const inputX =
            joystickVector.x;

        const inputZ =
            joystickVector.y;


        if (
            Math.abs(inputX) < 0.01 &&
            Math.abs(inputZ) < 0.01
        ) {

            playerVelocity.multiplyScalar(
                Math.max(
                    0,
                    1 - delta * 12
                )
            );

            return;
        }


        /*
         * Joystick:
         *
         * x = esquerda/direita
         * y = frente/trás
         *
         * Aqui usamos o eixo Z do mundo como
         * frente/trás.
         */

        const moveX =
            inputX * playerSpeed;

        const moveZ =
            inputZ * playerSpeed;


        playerVelocity.set(
            moveX,
            0,
            moveZ
        );


        const nextX =
            playerGroup.position.x +
            moveX * delta;


        const nextZ =
            playerGroup.position.z +
            moveZ * delta;


        // Colisão independente por eixo
        if (!collidesAt(nextX, playerGroup.position.z)) {
            playerGroup.position.x = nextX;
        }


        if (!collidesAt(playerGroup.position.x, nextZ)) {
            playerGroup.position.z = nextZ;
        }


        /*
         * O personagem olha para a direção do movimento.
         */

        playerDirection =
            Math.atan2(
                moveX,
                moveZ
            );


        playerGroup.rotation.y =
            playerDirection;
    }

        createNPC(

    function updateNPCs(delta) {

        npcs.forEach(npc => {

            if (
                npc.waiting
            ) {

                npc.wait -= delta;

                if (
                    npc.wait <= 0
                ) {
                    npc.waiting = false;
                }

                return;
            }


            const target =
                npc.patrolPoints[
                    npc.currentPoint
                ];


            const dx =
                target.x -
                npc.group.position.x;


            const dz =
                target.z -
                npc.group.position.z;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dz * dz
                );


            if (
                distance < 0.15
            ) {

                npc.currentPoint++;

                if (
                    npc.currentPoint >=
                    npc.patrolPoints.length
                ) {
                    npc.currentPoint = 0;
                }


                /*
                 * Pausa pequena no ponto.
                 */

                npc.waiting = true;

                npc.wait =
                    0.7 +
                    Math.random() * 1.8;

                return;
            }


            const nx =
                dx / distance;

            const nz =
                dz / distance;


            npc.group.position.x +=
                nx *
                npc.speed *
                delta;


            npc.group.position.z +=
                nz *
                npc.speed *
                delta;


            npc.group.rotation.y =
                Math.atan2(
                    nx,
                    nz
                );
        });
    }


    // =====================================================================
    // CÂMERA IMERSIVA
    // =====================================================================

    function updateImmersionCamera() {

        if (!immersionMode) {
            return;
        }


        if (
            cameraMode === "first"
        ) {

            /*
             * Primeira pessoa
             */

            playerGroup.visible = false;


            const eyePosition =
                playerGroup.position.clone();

            eyePosition.y += 1.6;


            camera.position.lerp(
                eyePosition,
                0.18
            );


            camera.rotation.set(
                0,
                playerGroup.rotation.y,
                0
            );


            controls.enabled = false;

        } else {

            /*
             * Terceira pessoa
             */

            playerGroup.visible = true;


            const offset =
                new THREE.Vector3(
                    0,
                    3.4,
                    6
                );


            offset.applyAxisAngle(
                new THREE.Vector3(0,1,0),
                playerGroup.rotation.y
            );


            const desired =
                playerGroup.position
                    .clone()
                    .add(offset);


            camera.position.lerp(
                desired,
                0.10
            );


            const lookTarget =
                playerGroup.position
                    .clone();

            lookTarget.y += 1.0;


            camera.lookAt(
                lookTarget
            );


            controls.enabled = false;
        }
    }


    // =====================================================================
    // ENTRAR / SAIR DO MODO IMERSÃO

    function enterImmersionMode() {

        immersionMode = true;

        autoRotate = false;


        controls.enabled = false;


        document

        document

                'active'
            );


        document
            .getElementById('immersion-toggle')
            .classList.add(

            );


        document
            .getElementById('immersion-toggle')
            .textContent = '👤';


        /*
         * Posiciona a câmera imediatamente atrás
         * do personagem para evitar salto.
         */

        cameraMode = "third";


        const initialOffset =
            new THREE.Vector3(
                0,
                3.4,
                6
            );


        initialOffset.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            playerGroup.rotation.y

        camera.position.copy(
            playerGroup.position
                .clone()
                .add(initialOffset)

        controls.target.copy(

        updateCameraLabel();
    }


    function exitImmersionMode() {

        immersionMode = false;


        playerGroup.visible = true;


        document
            .getElementById('hud')
            .classList.remove(
                'immersion-hidden'
            );


        document
            .getElementById('instructions')
            .classList.remove(
                'immersion-hidden'
            );

            .getElementById('immersion-ui')
            .classList.remove(
                'active'
            );


        document
            .getElementById('immersion-toggle')
            .classList.remove(
                'active'
            );


        document
            .getElementById('immersion-toggle')
            .textContent = '🎮';


        controls.enabled = true;

        controls.target.copy(
            playerGroup.position

    }


    function toggleImmersion() {

        if (immersionMode) {
            exitImmersionMode();
        } else {

    // =====================================================================
    // JOYSTICK MOBILE
    // =====================================================================

    function setupJoystick() {

        const zone =
            document.getElementById(
                'joystick-zone'
            );

        const base =
            document.getElementById(
                'joystick-base'
            );

        const knob =
            document.getElementById(
                'joystick-knob'
            );


        let activeTouchId = null;


        const radius = 52;


        function getCenter() {

            const rect =
                base.getBoundingClientRect();

            return {
                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2
            };
        }


        function updateJoystick(
            clientX,
            clientY
        ) {

            const center =
                getCenter();


            let dx =
                clientX -
                center.x;


            let dy =
                clientY -
                center.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance > radius
            ) {

                dx =
                    dx /
                    distance *
                    radius;

                dy =
                    dy /
                    distance *
                    radius;
            }


            joystickVector.x =
                dx / radius;


            /*
             * Tela:
             * para cima = movimento para frente.
             *
             * Por isso invertimos Y.
             */

            joystickVector.y =
                dy / radius;


            knob.style.transform =
                `translate(${dx}px, ${dy}px)`;
        }


        function resetJoystick() {

            activeTouchId = null;


            joystickVector.x = 0;
            joystickVector.y = 0;


            knob.style.transform =
                'translate(0px, 0px)';
        }


        zone.addEventListener(
            'touchstart',
            event => {

                if (!immersionMode) {
                    return;
                }


                event.preventDefault();


                if (
                    activeTouchId !== null
                ) {
                    return;
                }


                const touch =
                    event.changedTouches[0];


                activeTouchId =
                    touch.identifier;


                updateJoystick(
                    touch.clientX,
                    touch.clientY
                );

            },
            {
                passive: false
            }
        );


        zone.addEventListener(
            'touchmove',
            event => {

                if (!immersionMode) {
                    return;
                }


                event.preventDefault();


                for (
                    const touch
                    of event.changedTouches
                ) {

                    if (
                        touch.identifier ===
                        activeTouchId
                    ) {

                        updateJoystick(
                            touch.clientX,
                            touch.clientY
                        );

                        break;
                    }
                }

            },
            {
                passive: false
            }
        );


        zone.addEventListener(
            'touchend',
            event => {

                event.preventDefault();


                for (
                    const touch
                    of event.changedTouches
                ) {

                    if (
                        touch.identifier ===
                        activeTouchId
                    ) {

                        resetJoystick();

                        break;
                    }
                }

            },
            {
                passive: false
            }
        );


        zone.addEventListener(
            'touchcancel',
            resetJoystick,
            {
                passive: false
            }
        );
    }


    // =====================================================================
    // DIA / NOITE
    // =====================================================================

    function updateDayNightCycle() {

        const speed = 0.05;


        if (
            isNight &&
            dayNightTransition < 1
        ) {

            dayNightTransition +=
                speed;

        } else if (
            !isNight &&
            dayNightTransition > 0
        ) {

            dayNightTransition -=
                speed;
        }


        const skyColor =
            new THREE.Color(
                0x5075a6
            ).lerp(
                new THREE.Color(
                    0x020208
                ),
                dayNightTransition
            );


        skyMesh.material.color.copy(
            skyColor
        );


        scene.fog.color.copy(
            skyColor
        );


        renderer.setClearColor(
            skyColor
        );


        dirLight.intensity =
            THREE.MathUtils.lerp(
                1.5,
                0.1,
                dayNightTransition
            );


        dirLight.color.lerpColors(
            new THREE.Color(
                0xfff8e7
            ),
            new THREE.Color(
                0x55aaee
            ),
            dayNightTransition
        );


        hemiLight.intensity =
            THREE.MathUtils.lerp(
                0.8,
                0.2,
                dayNightTransition
            );


        streetLights.forEach(light => {

            light.spotLight.intensity =
                THREE.MathUtils.lerp(
                    0,
                    6,
                    dayNightTransition
                );


            light.lightFixture.material.color
                .lerpColors(
                    new THREE.Color(0x222222),
                    new THREE.Color(0xffffff),
                    dayNightTransition
                );
        });


        neonMaterials.forEach(mat => {

            mat.emissiveIntensity =
                THREE.MathUtils.lerp(
                    0,
                    1.8,
                    dayNightTransition
                );
        });


        interiorSpotlights.forEach(spot => {

            spot.intSpot.intensity =
                THREE.MathUtils.lerp(
                    1.2,
                    3.5,
                    dayNightTransition
                );
        });
    }

    // =====================================================================
    // ANIMAÇÃO DE CÂMERA ORIGINAL
    // =====================================================================

    function animateCamera(
        targetPosition,
        targetLookAt
    ) {

        if (immersionMode) {
            return;
        }


        let count = 0;

        const steps = 40;

        const startPos =
            camera.position.clone();

        const startLook =
            controls.target.clone();


        function step() {

            count++;


            const t =
                count / steps;


            const ease =
                Math.sin(
                    t * Math.PI / 2
                );


            camera.position.lerpVectors(
                startPos,
                targetPosition,
                ease
            );


            controls.target.lerpVectors(
                startLook,
                targetLookAt,
                ease
            );


            if (
                count < steps
            ) {

                requestAnimationFrame(
                    step
                );
            }
        }


        step();
    }


    // =====================================================================
    // LOOP PRINCIPAL
    // =====================================================================

    function animate() {

        requestAnimationFrame(
            animate
        );


        const delta =
            Math.min(
                clock.getDelta(),
                0.05
            );


        /*
         * Orbit só existe fora da imersão.
         */

        if (!immersionMode) {

            controls.autoRotate =
                autoRotate;

            controls.autoRotateSpeed =
                0.8;

            controls.update();
        }


        updateDayNightCycle();


        // ---------------------------------------------------------------
        // CARRO
        // ---------------------------------------------------------------

        if (
            carSpline &&
            carMesh
        ) {

            carProgress +=
                0.015 * delta;


            if (
                carProgress > 1
            ) {
                carProgress = 0;
            }


            const position =
                carSpline.getPointAt(
                    carProgress
                );


            carMesh.position.copy(
                position
            );


            const tangent =
                carSpline
                    .getTangentAt(
                        carProgress
                    )
                    .normalize();


            carMesh.lookAt(
                position
                    .clone()
                    .add(tangent)
            );
        }


        // ---------------------------------------------------------------
        // IMERSÃO
        // ---------------------------------------------------------------

        if (immersionMode) {

            updatePlayer(
                delta
            );

            updateImmersionCamera();

            updateNPCs(
                delta
            );
        }


        renderer.render(
            scene,
            camera
        );
    }


    // =====================================================================
    // RESIZE
    // =====================================================================

    function onWindowResize() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }


    // =====================================================================
    // START
    // =====================================================================

    window.onload = init;
