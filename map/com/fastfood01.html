<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>McDonald's 3D – Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1020);
scene.fog = new THREE.Fog(0x0a1020, 40, 120);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(18, 12, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.maxPolarAngle = Math.PI / 2.1;
controls.enableDamping = true;

// Luzes
scene.add(new THREE.AmbientLight(0x334466, 0.4));
const moon = new THREE.DirectionalLight(0x8899cc, 0.6);
moon.position.set(-20, 30, 10);
moon.castShadow = true;
scene.add(moon);

const neon = new THREE.PointLight(0xffcc00, 8, 40);
neon.position.set(-6, 9, 2);
scene.add(neon);

const windowLight = new THREE.RectAreaLight(0xffeecc, 6, 12, 3);
windowLight.position.set(2, 3.2, 4.1);
windowLight.lookAt(2, 3.2, 0);
scene.add(windowLight);

// Chão
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Calçada
const sidewalk = new THREE.Mesh(
  new THREE.BoxGeometry(28, 0.15, 14),
  new THREE.MeshStandardMaterial({ color: 0xc8c4b8 })
);
sidewalk.position.set(0, 0.08, 4);
scene.add(sidewalk);

function box(w,h,d, color, x,y,z, metal=0.1, rough=0.6) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough })
  );
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// Corpo principal
box(22, 6.5, 10, 0x1a1a1a, 0, 3.25, 0);
box(22, 1.2, 10.2, 0x111111, 0, 7.1, 0); // faixa preta superior

// Faixa vermelha vertical
box(1.4, 9.5, 1.6, 0xc8102e, -9.5, 4.75, 4.2);

// Marquise branca
box(14, 0.25, 3.5, 0xf0f0f0, -3, 6.6, 5.2);

// Golden Arch no topo
const archMat = new THREE.MeshStandardMaterial({ color: 0xffc72c, emissive: 0x553300, metalness: 0.4 });
const archL = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.22, 16, 32, Math.PI), archMat);
archL.rotation.z = Math.PI;
archL.position.set(-9.5, 10.3, 4.3);
scene.add(archL);
const archR = archL.clone();
archR.position.x = -8.3;
scene.add(archR);

// Letreiro McDonald's (simples)
function textPlane(txt, w, h, x, y, z) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,512,128);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 72px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(txt, 256, 90);
  const tex = new THREE.CanvasTexture(c);
  const p = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  p.position.set(x,y,z);
  scene.add(p);
}
textPlane("McDonald's", 10, 1.4, 2, 7.6, 5.12);

// Janelas (vidro + interior)
const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 3.4),
  new THREE.MeshPhysicalMaterial({
    color: 0xffeedd, transmission: 0.55, roughness: 0.05,
    metalness: 0, transparent: true, opacity: 0.85, emissive: 0x332211, emissiveIntensity: 0.4
  })
);
glass.position.set(1, 3.3, 5.05);
scene.add(glass);

// Interior (atrás do vidro)
const interiorGroup = new THREE.Group();
interiorGroup.position.z = 1;
scene.add(interiorGroup);

function furniture(w,h,d,c,x,y,z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:c}));
  m.position.set(x,y,z);
  interiorGroup.add(m);
}
// Piso interno
furniture(20, 0.1, 8, 0x8b6914, 0, 0.15, 0);
// Mesas
[[-4,1.2],[0,1.5],[4,0.8],[-2,-1]].forEach(([x,z]) => {
  furniture(1.4, 0.08, 0.9, 0xddd0c0, x, 0.85, z);
  furniture(0.12, 0.8, 0.12, 0x444, x, 0.4, z);
});
// Cadeiras
furniture(0.5, 0.5, 0.5, 0xc8102e, -4.6, 0.45, 1.2);
furniture(0.5, 0.5, 0.5, 0xc8102e, 0.6, 0.45, 1.5);
// Balcão McCafé
furniture(6, 1.1, 1.2, 0x2a2a2a, 5, 0.7, -2);
furniture(6, 0.08, 1.3, 0xeee, 5, 1.28, -2);

// Pessoas simplificadas
function person(x,z, shirt) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.55, 4, 8), new THREE.MeshStandardMaterial({color: shirt}));
  body.position.y = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshStandardMaterial({color: 0xe0b090}));
  head.position.y = 1.45;
  g.add(body, head);
  g.position.set(x, 0, z);
  interiorGroup.add(g);
}
person(-3.5, 1.0, 0x4a90a4);
person(-0.3, 1.3, 0x2d5a27);
person(3.8, 0.5, 0x333);

// McCafé letreiro
textPlane("McCafé", 3.2, 0.7, 8.2, 3.8, 5.12);

// Placa Drive Thru
const pole = box(0.15, 8, 0.15, 0x888, 14, 4, 8);
const sign = box(3.2, 2.4, 0.15, 0xc8102e, 14, 7.2, 8);
textPlane("Drive Thru", 2.8, 0.5, 14, 7.5, 8.1);

// Batata gigante
const fryBag = new THREE.Mesh(
  new THREE.CylinderGeometry(1.4, 1.8, 3.2, 8),
  new THREE.MeshStandardMaterial({ color: 0xc8102e })
);
fryBag.position.set(-14, 1.7, 6);
fryBag.castShadow = true;
scene.add(fryBag);
for (let i = 0; i < 18; i++) {
  const fry = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 2.2 + Math.random(), 0.18),
    new THREE.MeshStandardMaterial({ color: 0xffc72c })
  );
  fry.position.set(-14 + (Math.random()-0.5)*1.6, 3.4, 6 + (Math.random()-0.5)*1.2);
  fry.rotation.set((Math.random()-0.5)*0.3, 0, (Math.random()-0.5)*0.3);
  scene.add(fry);
}

// Postes de luz
function lamp(x,z) {
  box(0.12, 6, 0.12, 0x555, x, 3, z);
  const l = new THREE.PointLight(0xffeecc, 4, 18);
  l.position.set(x, 6.2, z);
  scene.add(l);
}
lamp(10, 10);
lamp(-16, 8);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  neon.intensity = 7 + Math.sin(Date.now()*0.003)*1.5;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
