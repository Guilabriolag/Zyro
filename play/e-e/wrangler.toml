name = "esconde-esconde-g0"
main = "server/worker.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

# Serve os arquivos estáticos do cliente (Workers Assets).
# Se sua versão do wrangler não suportar [assets], veja o README para a
# alternativa de publicar o /client em Cloudflare Pages.
[assets]
directory = "./client"
binding = "ASSETS"
