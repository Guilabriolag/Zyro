<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO 3D - Complexo Esportivo Corrigido</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0b0c10; font-family:'Segoe UI',sans-serif; }
  #info {
    position:absolute; top:10px; left:10px; z-index:10;
    color:#66fcf1; font-size:13px; background:rgba(15,15,26,0.9);
    padding:12px 16px; border-radius:8px; border:1px solid rgba(102,252,241,0.4);
    max-width: 480px; line-height: 1.4;
  }
</style>
</head>
<body>
<div id="info">
  🛹🏀🌳 <b>Complexo Reconfigurado — Visualização 3D Ativa</b><br>
  • <b>Topo:</b> Quadra de Basquete com alambrado alto (3m)<br>
  • <b>Centro:</b> Pista de Skate (Mini-ramp e obstáculos)<br>
  • <b>Base:</b> Pracinha circular com bancos amarelos e canteiros<br>
  • <b>Perímetro:</b> Avenida e Calçada paralelas à esquerda<br>
  <span style="color:#aaa; font-size:11px;">Arraste para girar | Scroll para zoom</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// 1. CENA, CÂMERA E RENDERIZADOR
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde2);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(-60, 50, -60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

// 2. ILUMINAÇÃO ESTÁVEL
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(-30, 60, 30);
scene.add(dirLight);

// 3. MATERIAIS SEGUROS (MeshLambertMaterial para performance garantida)
const grassMat = new THREE.MeshLambertMaterial({ color: 0x6b8e4e });
const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const lineMat = new THREE.MeshLambertMaterial({ color: 0xffeb3b });
const pathMat = new THREE.MeshLambertMaterial({ color: 0x9e9e9e });
const courtMat = new THREE.MeshLambertMaterial({ color: 0x2b5b84 });
const courtBorderMat = new THREE.MeshLambertMaterial({ color: 0xc7522a });
const skateMat = new THREE.MeshLambertMaterial({ color: 0xc7c2b6 });
const fenceMat = new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true });
const benchMat = new THREE.MeshLambertMaterial({ color: 0xf4c430 });
const bushMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
const treeMat = new THREE.MeshLambertMaterial({ color: 0x1e5a2c });
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3d2b });

// Gramado Base
const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 240), grassMat);
grass.rotation.x = -Math.PI / 2;
scene.add(grass);

// 4. AVENIDA E CALÇADA (ESQUERDA)
const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 240), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(-32, 0.01, 0);
scene.add(road);

const roadLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 240), lineMat);
roadLine.rotation.x = -Math.PI / 2;
roadLine.position.set(-32, 0.02, 0);
scene.add(roadLine);

const walkway = new THREE.Mesh(new THREE.PlaneGeometry(4, 240), pathMat);
walkway.rotation.x = -Math.PI / 2;
walkway.position.set(-23, 0.02, 0);
scene.add(walkway);

// 5. TOPO: QUADRA DE BASQUETE (Z = -55)
const courtGroup = new THREE.Group();
const court = new THREE.Mesh(new THREE.BoxGeometry(12, 0.1, 10), courtMat);
court.position.y = 0.05;
courtGroup.add(court);

const courtBorder = new THREE.Mesh(new THREE.BoxGeometry(12.6, 0.08, 10.6), courtBorderMat);
courtBorder.position.y = 0.04;
courtGroup.add(courtBorder);

// Alambrado Alto (3m) na retaguarda da quadra
const fenceBack = new THREE.Mesh(new THREE.BoxGeometry(12.8, 3.0, 0.1), fenceMat);
fenceBack.position.set(0, 1.5, -5.3);
courtGroup.add(fenceBack);

const fenceRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3.0, 10.6), fenceMat);
fenceRight.position.set(6.4, 1.5, 0);
courtGroup.add(fenceRight);

courtGroup.position.set(0, 0, -55);
scene.add(courtGroup);

// 6. CENTRO: PISTA DE SKATE (Z = -5)
const skateGroup = new THREE.Group();

// Flat / Base da pista
const skateFloor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 35), skateMat);
skateFloor.position.y = 0.1;
skateGroup.add(skateFloor);

// Mini-ramp (Lado Norte)
const ramp1 = new THREE.Mesh(new THREE.BoxGeometry(10, 2.0, 4), skateMat);
ramp1.position.set(0, 1.0, -15.5);
skateGroup.add(ramp1);

// Rampas e Obstáculos
const funbox = new THREE.Mesh(new THREE.BoxGeometry(6, 0.8, 8), skateMat);
funbox.position.set(0, 0.4, 0);
skateGroup.add(funbox);

const ramp2 = new THREE.Mesh(new THREE.BoxGeometry(10, 2.5, 5), skateMat);
ramp2.position.set(0, 1.25, 15);
skateGroup.add(ramp2);

// Alambrado Baixo (~1,1m) na lateral da pista (lado da calçada)
const lowFence = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 35), fenceMat);
lowFence.position.set(-5.1, 0.55, 0);
skateGroup.add(lowFence);

skateGroup.position.set(-2, 0, -5);
scene.add(skateGroup);

// 7. BASE: PRACINHA CIRCULAR (Z = 45)
const plazaGroup = new THREE.Group();

const ring = new THREE.Mesh(new THREE.RingGeometry(2, 9, 32), pathMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.03;
plazaGroup.add(ring);

const centerBed = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.3, 24), bushMat);
centerBed.position.y = 0.15;
plazaGroup.add(centerBed);

// Bancos Amarelos
function addBench(x, z, rot) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.6), benchMat);
  b.position.set(x, 0.2, z);
  b.rotation.y = rot;
  plazaGroup.add(b);
}
addBench(-6, 0, Math.PI / 2);
addBench(6, 0, -Math.PI / 2);
addBench(0, 6, Math.PI);

plazaGroup.position.set(0, 0, 45);
scene.add(plazaGroup);

// 8. ÁRBORES (PONTOS VERDE-ESCURO)
function addTree(x, z) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), trunkMat);
  trunk.position.y = 1;
  tree.add(trunk);

  const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), treeMat);
  foliage.position.y = 2.8;
  tree.add(foliage);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

[[-16,-40],[-16,-10],[-16,20],[-16,50], [12,-40],[12,-10],[12,20],[12,50]].forEach(p => addTree(p[0], p[1]));

// LOOP DE RENDERIZAÇÃO
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
