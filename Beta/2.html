<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZYRO — Rodoviária 3D V0.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { overflow: hidden; background: #101318; font-family: Arial, sans-serif; }
  #hud {
    position: fixed; top: 15px; left: 15px; z-index: 10; color: white;
    background: rgba(10,15,20,.82); padding: 12px 16px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 8px; font-size: 13px;
  }
  #hud strong { color: #66fcf1; }
  #log-box {
    position: fixed; bottom: 15px; left: 15px; z-index: 10; color: #66fcf1;
    background: rgba(10,15,20,.9); padding: 10px; border-radius: 6px;
    font-family: monospace; font-size: 11px; max-width: 90vw; pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <strong>ZYRO — RODOVIÁRIA 3D</strong><br>
  Toque/Clique nos elementos para interagir · Arraste para girar
</div>

<div id="log-box">ZYROLOG: Aguardando eventos...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============================================================
// CENA E RENDERIZADOR
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d8);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(22, 16, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;

// ============================================================
// ILUMINAÇÃO
// ============================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// ============================================================
// MATERIAIS
// ============================================================
const mat = {
  piso: new THREE.MeshStandardMaterial({ color: 0x555b63 }),
  parede: new THREE.MeshStandardMaterial({ color: 0xe5e1d8 }),
  vidro: new THREE.MeshStandardMaterial({ color: 0x75a9bd, transparent: true, opacity: .45 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x30343a, metalness: .7, roughness: .3 }),
  banco: new THREE.MeshStandardMaterial({ color: 0x273b45 }),
  amarelo: new THREE.MeshStandardMaterial({ color: 0xe0a82e }),
  preto: new THREE.MeshStandardMaterial({ color: 0x17191d }),
  branco: new THREE.MeshStandardMaterial({ color: 0xf2f2ee }),
  painel: new THREE.MeshStandardMaterial({ color: 0x101820, emissive: 0x06252b })
};

// ============================================================
// PRIMITIVAS
// ============================================================
function box(x, y, z, sx, sy, sz, material, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(x, y, z, radius, height, material, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 16), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CONSTRUÇÃO DO CENÁRIO
// ============================================================
box(0, -0.25, 0, 60, .5, 60, mat.piso); // Chão
box(0, 5, -11, 32, 10, 1, mat.parede);  // Parede Fundo
box(-16, 5, 0, 1, 10, 24, mat.parede);  // Esquerda
box(16, 5, 0, 1, 10, 24, mat.parede);   // Direita
box(0, 10, 0, 32, .5, 24, mat.parede);   // Teto

// Fachada Vidro
box(-11, 5, 11, 9, 9, .25, mat.vidro);
box(11, 5, 11, 9, 9, .25, mat.vidro);

// Guichê de Passagens (Interativo)
const guiche = box(-7, 1.2, -8, 10, 1.2, 2, mat.banco);
box(-7, 2.5, -8.8, 9, 2.5, .3, mat.branco);
for (let i = 0; i < 4; i++) box(-11 + i * 2.7, 2.2, -8.8, .08, 2, .3, mat.metal);

guiche.userData = { type: "interaction", verbo: "comprar_passagem", objeto: "GUICHE_01" };

// Painel de Horários
box(7, 5.2, -9.8, 10, 4.5, .3, mat.painel);
for (let i = 0; i < 6; i++) {
  box(7, 6.8 - i * .55, -10.02, 8, .12, .05, i === 2 ? mat.amarelo : mat.branco);
}

// Ônibus
function criarOnibus(x, z) {
  const bus = new THREE.Group();
  box(0, 2.3, 0, 12, 4, 3, mat.amarelo, bus); // Carroceria
  box(0, .8, 0, 11.5, 1, 2.8, mat.preto, bus);  // Chassi
  
  for (let i = -4; i <= 4; i += 2) {
    box(i, 3.4, -1.52, 1.5, 1.4, .05, mat.vidro, bus);
  }
  for (let wx of [-4.2, 4.2]) {
    cylinder(wx, .7, -1.55, .8, .5, mat.preto, bus);
    cylinder(wx, .7, 1.55, .8, .5, mat.preto, bus);
  }

  // Porta do Ônibus (Interativa)
  const porta = box(6.13, 2, -1.51, .1, 2.5, 1.2, mat.vidro, bus);
  porta.userData = { type: "interaction", verbo: "entrar", objeto: "BUS_001" };

  bus.position.set(x, 0, z);
  scene.add(bus);
  return bus;
}
criarOnibus(0, 18);

// ============================================================
// CORE: ZYROLOG & MOTOR DE EVENTOS
// ============================================================
function emitirEvento(entidade, verbo, objeto, estadoAnterior, estadoNovo) {
  const evento = {
    id: "EVT_" + Date.now(),
    entidade, verbo, objeto,
    estado_anterior: estadoAnterior,
    estado_novo: estadoNovo,
    timestamp: Date.now()
  };

  document.getElementById("log-box").innerText = 
    `ZYROLOG: [${evento.entidade}] ${evento.verbo} -> ${evento.objeto}`;
    
  console.log("ZYROLOG EVENT:", evento);
  return evento;
}

// Raycaster para Ray-Shooting nos Objetos Interativos
renderer.domElement.addEventListener("click", (event) => {
  const mouse = new THREE.Vector2(
    (event.clientX / innerWidth) * 2 - 1,
    -(event.clientY / innerHeight) * 2 + 1
  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);

  if (!hits.length) return;

  let obj = hits[0].object;
  while (obj && !obj.userData.type) obj = obj.parent;

  if (obj && obj.userData.type === "interaction") {
    emitirEvento(
      "Jogador_01",
      obj.userData.verbo,
      obj.userData.objeto,
      "fora",
      "interagindo"
    );
  }
});

// Loop & Resize
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
