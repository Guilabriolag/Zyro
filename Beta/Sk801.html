<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO 3D - Pista v4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0b0c10; font-family:'Segoe UI',sans-serif; }
  #info {
    position:absolute; top:10px; left:10px; z-index:10;
    color:#66fcf1; font-size:13px; background:rgba(15,15,26,0.8);
    padding:8px 14px; border-radius:6px; border:1px solid rgba(102,252,241,0.4);
    max-width: 300px;
  }
</style>
</head>
<body>
<div id="info">🛹 ZYRO 3D v4 — caixote central (corrimão longitudinal) → rampa 90° pra cada lado → platô | Arraste pra girar, scroll pra zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde2);
scene.fog = new THREE.Fog(0xd7dde2, 50, 110);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6, 10, 26);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;

const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(-15, 25, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
scene.add(sun);

const concreteMat = new THREE.MeshStandardMaterial({ color: 0xc7c2b6, roughness: 0.9 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, metalness: 0.5, roughness: 0.4 });
const grassMat = new THREE.MeshStandardMaterial({ color: 0x7a9b5c });

const grass = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), grassMat);
grass.rotation.x = -Math.PI/2;
grass.receiveShadow = true;
scene.add(grass);

const RAMP_WIDTH = 6;
const THICK = 0.3;

function segment(x1, y1, x2, y2, z, width = RAMP_WIDTH){
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  const geo = new THREE.BoxGeometry(len, THICK, width);
  const mesh = new THREE.Mesh(geo, concreteMat);
  mesh.position.set((x1+x2)/2, (y1+y2)/2, z);
  mesh.rotation.z = angle;
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// curva de 90°: sobe (dir=-1 vai pra esquerda, dir=+1 vai pra direita)
function curve90(x0, y0, radius, dir, z, segs = 12, width = RAMP_WIDTH){
  const pts = [];
  for(let i=0;i<=segs;i++){
    const t = (i/segs) * (Math.PI/2);
    const px = x0 + dir * radius * Math.sin(t);
    const py = y0 + radius * (1 - Math.cos(t));
    pts.push([px,py]);
  }
  for(let i=0;i<segs;i++){
    segment(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1], z, width);
  }
  return pts[segs];
}

// corrimão LONGITUDINAL (no sentido do percurso, eixo X) sobre o topo do caixote
function longRail(xCenter, yTop, z, length){
  const g = new THREE.Group();
  const barHeight = 0.42; // altura do corrimão acima da superfície
  const postHeight = barHeight;
  [-length/2, length/2].forEach(xOff => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035, postHeight, 8), metalMat);
    post.position.set(xOff, postHeight/2, 0);
    post.castShadow = true;
    g.add(post);
  });
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03, length, 8), metalMat);
  bar.rotation.z = Math.PI/2; // deita o cilindro ao longo do eixo X
  bar.position.set(0, barHeight, 0);
  bar.castShadow = true;
  g.add(bar);
  g.position.set(xCenter, yTop, z);
  scene.add(g);
}

const Z = 0;

// ---------- CAIXOTE CENTRAL (hip: sobe 35° / platô reto / desce 35°) ----------
const run = 1.3;               // comprimento horizontal de cada rampa de 35°
const angle35 = 35 * Math.PI/180;
const hipHeight = run * Math.tan(angle35); // ~0.91
const topFlat = 1.4;           // comprimento do platô reto no topo

const xUpStart = -topFlat/2 - run;   // -2.0
const xUpEnd   = -topFlat/2;         // -0.7
const xDownStart = topFlat/2;        // 0.7
const xDownEnd  = topFlat/2 + run;   // 2.0

segment(xUpStart, 0, xUpEnd, hipHeight, Z);            // sobe 35°
segment(xUpEnd, hipHeight, xDownStart, hipHeight, Z);  // platô reto no topo
segment(xDownStart, hipHeight, xDownEnd, 0, Z);        // desce 35°

// corrimão longitudinal por cima do platô do caixote
longRail(0, hipHeight + THICK/2, Z, topFlat + 0.6);

// ---------- RAMPA CURVA DE 90° PRA ESQUERDA, saindo do pé esquerdo do caixote ----------
const radius = 3.2;
let pLeft = curve90(xUpStart, 0, radius, -1, Z, 12); // termina em (xUpStart-radius, radius)
// platô elevado à esquerda
segment(pLeft[0], pLeft[1], pLeft[0] - 3, pLeft[1], Z);

// ---------- RAMPA CURVA DE 90° PRA DIREITA, saindo do pé direito do caixote ----------
let pRight = curve90(xDownEnd, 0, radius, 1, Z, 12);
// platô elevado à direita
segment(pRight[0], pRight[1], pRight[0] + 3, pRight[1], Z);

// ---------- Postes de luz ----------
function lampPost(px,pz){
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,5.5,8), new THREE.MeshStandardMaterial({color:0x333333, metalness:0.4}));
  pole.position.set(px, 2.75, pz);
  pole.castShadow = true;
  scene.add(pole);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,10,10), new THREE.MeshStandardMaterial({color:0xfff3c4, emissive:0xfff3c4, emissiveIntensity:0.25}));
  head.position.set(px, 5.4, pz);
  scene.add(head);
}
[[-12,-8],[12,-8],[-12,8],[12,8]].forEach(pp=>lampPost(pp[0],pp[1]));

// ---------- Árvores ----------
function arvore(px,pz){
  const g = new THREE.Group();
  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,2,8), new THREE.MeshStandardMaterial({color:0x5a3d2b}));
  tronco.position.y = 1; tronco.castShadow = true;
  const copa = new THREE.Mesh(new THREE.SphereGeometry(1.6,10,10), new THREE.MeshStandardMaterial({color:0x3a7a45}));
  copa.position.y = 2.8; copa.castShadow = true;
  g.add(tronco, copa);
  g.position.set(px,0,pz);
  scene.add(g);
}
[[-18,-12],[18,-12],[-18,12],[18,12],[0,-16],[0,16]].forEach(pp=>arvore(pp[0],pp[1]));

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
