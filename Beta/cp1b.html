<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO 3D — Complexo Esportivo v21</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0b0c10; font-family: "Segoe UI", sans-serif; }
  #info {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    color: #66fcf1; font-size: 13px; background: rgba(15,15,26,0.88);
    padding: 10px 14px; border-radius: 6px; border: 1px solid rgba(102,252,241,0.4);
    max-width: 500px; line-height: 1.45;
  }
</style>
</head>
<body>
<div id="info">
  🛹🏀🌳 <b>ZYRO 3D — Complexo Esportivo v21</b><br>
  • **Topo:** Praça circular e Academia ao Ar Livre<br>
  • **Centro:** Pista de Skate<br>
  • **Base:** Quadra de Basquete<br>
  • **Cerca Baixa:** Da entrada da praça até o mini-ramp<br>
  • **Cerca Alta (3m):** Do mini-ramp até atrás da cesta<br>
  <span style="color:#aaa;font-size:11px;">Arraste para girar | Scroll para zoom</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde2);
scene.fog = new THREE.Fog(0xd7dde2, 80, 220);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(-35, 40, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

/* ILUMINAÇÃO */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-20, 45, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

/* MATERIAIS */
const grassMat = new THREE.MeshLambertMaterial({ color: 0x6b8e4e });
const roadMat = new THREE.MeshLambertMaterial({ color: 0x303030 });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xb7b7b7 });
const concreteMat = new THREE.MeshLambertMaterial({ color: 0xc7c2b6 });
const wallMat = new THREE.MeshLambertMaterial({ color: 0x9b968a });
const metalMat = new THREE.MeshLambertMaterial({ color: 0x1c1c1c });
const courtFloorMat = new THREE.MeshLambertMaterial({ color: 0x2b5b84 });
const courtBorderMat = new THREE.MeshLambertMaterial({ color: 0xc7522a });
const lineMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const benchMat = new THREE.MeshLambertMaterial({ color: 0xf4c430 });
const bushMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
const treeDarkMat = new THREE.MeshLambertMaterial({ color: 0x1e5a2c });
const gymMat = new THREE.MeshLambertMaterial({ color: 0x1976d2 });
const hoopMat = new THREE.MeshLambertMaterial({ color: 0xff4500 });
const fenceMat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });

/* GRAMADO */
const grass = new THREE.Mesh(new THREE.PlaneGeometry(180, 220), grassMat);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

/* AVENIDA E CALÇADA PARALELA */
const ROAD_X = -18;
const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 220), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(ROAD_X, 0.01, 0);
scene.add(road);

const divider = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 220), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
divider.rotation.x = -Math.PI / 2;
divider.position.set(ROAD_X, 0.02, 0);
scene.add(divider);

const SIDEWALK_X = -11.5;
const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 220), sidewalkMat);
sidewalk.position.set(SIDEWALK_X, 0.06, 0);
scene.add(sidewalk);

/* =====================================================
   1. TOPO: PRAÇA CIRCULAR E ACADEMIA (Z = -55)
   ===================================================== */
const plazaZ = -55;
const plaza = new THREE.Mesh(new THREE.RingGeometry(3.5, 8.5, 32), sidewalkMat);
plaza.rotation.x = -Math.PI / 2;
plaza.position.set(0, 0.025, plazaZ);
scene.add(plaza);

const centerBed = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.3, 24), bushMat);
centerBed.position.set(0, 0.15, plazaZ);
scene.add(centerBed);

// Bancos Amarelos
function addBench(x, z, rotY) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2, 0.08, 0.5), benchMat); seat.position.y = 0.45; g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 0.06), benchMat); back.position.set(0, 0.7, -0.22); g.add(back);
  g.position.set(x, 0, z); g.rotation.y = rotY;
  scene.add(g);
}
addBench(-4, plazaZ - 5.5, 0);
addBench(4, plazaZ - 5.5, 0);

// Academia ao Ar Livre
const gymArea = new THREE.Mesh(new THREE.BoxGeometry(8, 0.05, 8), concreteMat);
gymArea.position.set(10, 0.025, plazaZ);
scene.add(gymArea);

function addGymEquipment(x, z) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.8, 10), gymMat);
  post.position.set(x, 0.9, z);
  scene.add(post);
}
addGymEquipment(8, plazaZ - 2);
addGymEquipment(12, plazaZ + 2);

/* =====================================================
   2. CENTRO: PISTA DE SKATE (Z = -15 até 15)
   ===================================================== */
const skateFloor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 30), concreteMat);
skateFloor.position.set(0, 0.1, 0);
scene.add(skateFloor);

// Mini-ramp no início da pista (Z = -12)
const miniRamp = new THREE.Mesh(new THREE.BoxGeometry(10, 2.5, 5), concreteMat);
miniRamp.position.set(0, 1.25, -12);
scene.add(miniRamp);

const funbox = new THREE.Mesh(new THREE.BoxGeometry(6, 0.8, 8), concreteMat);
funbox.position.set(0, 0.4, 0);
scene.add(funbox);

/* =====================================================
   3. BASE: QUADRA DE BASQUETE (Z = 55)
   ===================================================== */
const courtZ = 55;
const courtFloor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.08, 10), courtFloorMat);
courtFloor.position.set(0, 0.04, courtZ);
scene.add(courtFloor);

const courtBorder = new THREE.Mesh(new THREE.BoxGeometry(12.6, 0.06, 10.6), courtBorderMat);
courtBorder.position.set(0, 0.03, courtZ);
scene.add(courtBorder);

// Cesta de Basquete no fundo (Z = 59.5)
const hoop = new THREE.Group();
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 4, 12), metalMat); pole.position.y = 2; hoop.add(pole);
const board = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.1, 0.08), lineMat); board.position.set(0, 3.3, -0.6); hoop.add(board);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.03, 8, 16), hoopMat); rim.rotation.x = Math.PI/2; rim.position.set(0, 2.95, -0.9); hoop.add(rim);
hoop.position.set(0, 0, courtZ + 4.5);
scene.add(hoop);

/* =====================================================
   4. CERCA / ALAMBRADO DINÂMICO
   ===================================================== */
// Cerca Baixa (~1.1m): Entrada da Praça (Z = -70) até o Mini-Ramp (Z = -12)
const lowFence = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.1, 58), fenceMat);
lowFence.position.set(-9.8, 0.55, -41);
scene.add(lowFence);

// Cerca Alta (3m): Do Mini-Ramp (Z = -12) até atrás da Cesta (Z = 61)
const highFenceSide = new THREE.Mesh(new THREE.BoxGeometry(0.05, 3.0, 73), fenceMat);
highFenceSide.position.set(-9.8, 1.5, 24.5);
scene.add(highFenceSide);

// Cerca Alta no Fundo da Quadra (atrás da cesta)
const highFenceBack = new THREE.Mesh(new THREE.BoxGeometry(12.6, 3.0, 0.05), fenceMat);
highFenceBack.position.set(0, 1.5, 60.3);
scene.add(highFenceBack);

/* =====================================================
   5. ÁRVORES (VERDE-ESCURO)
   ===================================================== */
function addTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.5), new THREE.MeshLambertMaterial({ color: 0x5a3d2b }));
  trunk.position.y = 1.25; g.add(trunk);
  const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.8, 10, 10), treeDarkMat);
  foliage.position.y = 3.2; g.add(foliage);
  g.position.set(x, 0, z);
  scene.add(g);
}

[[-16, -60], [-16, -30], [-16, 0], [-16, 30], [-16, 60], [14, -50], [14, -20], [14, 10], [14, 40]].forEach(p => addTree(p[0], p[1]));

/* CONTROLES / ANIMATION */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
