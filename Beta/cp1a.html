const RAMP_WIDTH = 5.0;
const THICK = 0.3;

const Z1 = 0;
const Z2 = RAMP_WIDTH;


function buildSideWall(
  x1,
  y1,
  x2,
  y2,
  zCenter,
  width
){
  /*
    Mantida apenas como geometria da pista.
    Não cria alambrado.
  */

  const maxY = Math.max(y1,y2);

  if(maxY <= 0.05) return;

  const shape = new THREE.Shape();

  shape.moveTo(x1,0);
  shape.lineTo(x1,y1);
  shape.lineTo(x2,y2);
  shape.lineTo(x2,0);
  shape.closePath();

  const wall = new THREE.Mesh(
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth:width,
        bevelEnabled:false
      }
    ),
    concreteMat
  );

  wall.position.z =
    zCenter - width/2;

  wall.castShadow = true;
  wall.receiveShadow = true;

  scene.add(wall);
}


function segment(
  x1,y1,z1,
  x2,y2,z2,
  width=RAMP_WIDTH
){

  const dx = x2-x1;
  const dy = y2-y1;
  const dz = z2-z1;

  const len =
    Math.hypot(dx,dy,dz);

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(
      len,
      THICK,
      width
    ),
    concreteMat
  );

  mesh.position.set(
    (x1+x2)/2,
    (y1+y2)/2,
    (z1+z2)/2
  );

  mesh.rotation.z =
    Math.atan2(dy,dx);

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  buildSideWall(
    x1,y1,
    x2,y2,
    z1,
    width
  );

  return mesh;
}


function curveUp(
  x0,
  y0,
  radius,
  angleDeg,
  z,
  dirX,
  segs=14,
  width=RAMP_WIDTH
){

  const pts = [];

  const total =
    angleDeg*Math.PI/180;

  for(let i=0;i<=segs;i++){

    const t =
      (i/segs)*total;

    pts.push([
      x0 +
      dirX*radius*Math.sin(t),

      y0 +
      radius*(1-Math.cos(t))
    ]);

  }

  for(let i=0;i<segs;i++){

    segment(
      pts[i][0],
      pts[i][1],
      z,

      pts[i+1][0],
      pts[i+1][1],
      z,

      width
    );

  }

  return pts[segs];
}


function longRail(
  xCenter,
  yTop,
  z,
  length
){

  const g =
    new THREE.Group();

  const barHeight = 0.42;

  [-length/2,length/2]
  .forEach(xOff=>{

    const post =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.035,
          0.035,
          barHeight,
          8
        ),
        metalMat
      );

    post.position.set(
      xOff,
      barHeight/2,
      0
    );

    g.add(post);

  });

  const bar =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.03,
        0.03,
        length,
        8
      ),
      metalMat
    );

  bar.rotation.z =
    Math.PI/2;

  bar.position.set(
    0,
    barHeight,
    0
  );

  g.add(bar);

  g.position.set(
    xCenter,
    yTop,
    z
  );

  scene.add(g);
}

const runCaixote = 2.0;

segment(

const xP1_Ramp45DownEnd =

segment(

  Z1,

);

const xP1_CaixoteStart =

segment(

);

const xP1_CaixoteTopStart =

const xP1_CaixoteTopEnd =
  xP1_CaixoteTopStart -
  topFlat;

const xP1_CaixoteDownEnd =
  xP1_CaixoteTopEnd -
  runCaixote;

segment(
  xP1_CaixoteStart,
  0,
  Z1,

  xP1_CaixoteTopStart,
  hipHeight,
  Z1
);

segment(
  xP1_CaixoteTopStart,
  hipHeight,
  Z1,

  xP1_CaixoteTopEnd,
  hipHeight,
  Z1
);

segment(

  hipHeight,
  Z1,

  xP1_CaixoteDownEnd,
  0,
  Z1
);

longRail(
  (xP1_CaixoteTopStart +
   xP1_CaixoteTopEnd)/2,

  hipHeight + THICK/2,

  Z1,

  topFlat + 0.4
);

const xP1_QuarterBase =
  xP1_CaixoteDownEnd -
  4.5;

segment(
  xP1_CaixoteDownEnd,
  0,
  Z1,

  xP1_QuarterBase,
  0,
  Z1
);

const radius90 = 4.5;

for(let i=0;i<12;i++){

  const t1 =

  const t2 =
    ((i+1)/12)*(Math.PI/2);

  segment(

    xP1_QuarterBase -
    radius90*Math.sin(t1),

    radius90*(1-Math.cos(t1)),

    Z1,

    xP1_QuarterBase -
    radius90*Math.sin(t2),

    radius90*(1-Math.cos(t2)),

    Z1

  );

}

segment(

  Z1,

  Z1

for(let i=0;i<12;i++){

    miniRampRadius*(1-Math.cos(t2)),

const xP2_DropBottom =

segment(

function addBench(
  x,
  z,
  rotation
){

  const g =
    new THREE.Group();

  const seat =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        0.1,
        0.5
      ),
      benchMat

    0.5;

  g.add(seat);


  const back =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        0.45,
        0.08
      ),
      benchMat
    );

  back.position.set(
    0,
    0.75,
    -0.2
  );

  g.add(back);


  [-0.75,0.75]
  .forEach(px=>{

    const leg =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.08,
          0.5,
          0.4
        ),
        metalMat
      );

    leg.position.set(
      px,
      0.25,
      0
    );

    g.add(leg);

  });


  g.position.set(
    x,
    0,
    z
  );

  g.rotation.y =
    rotation;

  scene.add(g);
}

        0.08,
        1.6
      ),
      gymMat
    );

  p.position.y =
    0.8;

  g.add(p);


  const t =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.8,
        0.1,
        0.4
      ),
      metalMat
    );

  t.position.y =
    1.4;

  g.add(t);


  g.position.set(
    x,
    0,
    z
  );

  scene.add(g);
}


addGymEq(
  gymX-2,
  courtCenterZ-3
);

addGymEq(
  gymX-2,
  courtCenterZ+3
);

addGymEq(
  gymX+2,
  courtCenterZ-3
);

addGymEq(
  gymX+2,
  courtCenterZ+3
);


/* =====================================================
   FLORES / VEGETAÇÃO DA PRAÇA
===================================================== */

const flowerRed =
  new THREE.MeshStandardMaterial({
    color:0xe53935
  });

const flowerYellow =
  new THREE.MeshStandardMaterial({
    color:0xffeb3b
  });


for(let i=0;i<28;i++){

  const r =
    Math.random()*2.5;

  const a =
    Math.random()*Math.PI*2;

  const flower =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.13,
        6,
        6
      ),
      Math.random()>0.5
        ? flowerRed
        : flowerYellow
    );

  flower.position.set(
    parkX +
    Math.cos(a)*r,

    0.38,

    courtCenterZ +
    Math.sin(a)*r
  );

  scene.add(flower);
}


/* =====================================================
   ÁRVORES
===================================================== */

function addTree(
  x,
  z
){

  const t =
    new THREE.Group();


  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.2,
        0.3,
        2.5
      ),
      new THREE.MeshStandardMaterial({
        color:0x5a3d2b
      })
    );

  trunk.position.y =
    1.25;

  t.add(trunk);


  const foliage =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.8,
        12,
        12
      ),
      treeMat
    );

  foliage.position.y =
    3.2;

  t.add(foliage);


  t.position.set(
    x,
    0,
    z
  );

  scene.add(t);
}


/*
   Árvores reposicionadas fora
   da área de circulação.
*/

[
  [-18,-14],
  [-5,-14],
  [10,-14],
  [25,-14],

  [-18,14],
  [0,14],
  [15,14],
  [30,14]
]
.forEach(
  p => addTree(p[0],p[1])
);


/* =====================================================
   ILUMINAÇÃO
===================================================== */

function lampPost(
  px,
  pz
){

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.08,
        0.08,
        5.5,
        8
      ),
      metalMat
    );

  pole.position.set(
    px,
    2.75,
    pz
  );

  pole.castShadow = true;

  scene.add(pole);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.35,
        10,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0xfff3c4,
        emissive:0xfff3c4,
        emissiveIntensity:0.25
      })
    );

  head.position.set(
    px,
    5.4,
    pz
  );

  scene.add(head);
}


lampPost(
  parkX-8,
  courtCenterZ-8
);

lampPost(
  parkX+8,
  courtCenterZ-8
);

lampPost(
  courtX+2,
  courtCenterZ+7
);

lampPost(
  courtX+10,
  courtCenterZ+7
);


/* =====================================================
   IMPORTANTE — NENHUMA CERCA
=====================================================

   Não existe nesta versão:
   - alambrado da quadra
   - alambrado da pista
   - cerca na calçada
   - guarda-corpo
   - cerca fechando a avenida

   O espaço entre os equipamentos fica aberto.
*/


/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =====================================================
   RESPONSIVIDADE
===================================================== */

addEventListener(
  'resize',
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>
