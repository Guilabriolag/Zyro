<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>FGG Studio - WYSIWYG Editor</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; color: var(--accent); font-weight: 700; }

    .mobile-tabs {
      display: flex;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 0.75rem 0.2rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    button {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary { background-color: var(--accent); color: #000; border: none; }

    .main-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 1rem;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 0.8rem;
    }

    .tab-content.active { display: flex; }

    /* Estilos do Canvas/Preview Interativo */
    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--panel-bg);
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 0.5rem;
    }

    .code-textarea {
      background-color: #050811;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      flex: 1;
      outline: none;
      resize: none;
      width: 100%;
    }

    #rendered-view {
      background-color: #ffffff;
      color: #000;
      border-radius: 8px;
      padding: 1rem;
      flex: 1;
      overflow: hidden;
      border: 2px dashed var(--border);
      position: relative;
      user-select: none;
    }

    /* Classe ativada quando o Canvas está destravado */
    #rendered-view.unlocked {
      border-color: var(--warning);
      background-color: #f8fafc;
    }

    #rendered-view.unlocked * {
      cursor: move !important;
      outline: 2px dashed #38bdf8;
      outline-offset: 2px;
    }

    .hidden { display: none !important; }

    @media (min-width: 850px) {
      .mobile-tabs { display: none; }
      .main-content { display: grid; grid-template-columns: 280px 1fr 320px; }
      .tab-content { position: relative; display: flex !important; border-right: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ FGG Canvas Editor</h1>
    <span id="save-status" style="font-size:0.75rem; color:var(--success)">Sincronizado</span>
  </header>

  <nav class="mobile-tabs">
    <button class="tab-btn active" onclick="switchTab('tab-viewer')">👁️ Editor / Preview</button>
    <button class="tab-btn" onclick="switchTab('tab-code')">💻 Código Fonte</button>
  </nav>

  <div class="main-content">
    
    <!-- PREVIEW E EDITOR VISUAL (WYSIWYG) -->
    <div class="tab-content active" id="tab-viewer">
      <div class="viewer-toolbar">
        <span id="viewer-filename" style="font-size: 0.85rem; font-weight: 600;">desenho_vetorial.svg</span>
        <button id="lock-btn" onclick="toggleCanvasLock()" style="background-color: var(--card-bg);">
          🔒 Travado (Ver)
        </button>
      </div>

      <!-- Área do Preview / Canvas Interativo -->
      <div id="rendered-view"></div>
    </div>

    <!-- PAINEL DE CÓDIGO (SINCRONIZADO) -->
    <div class="tab-content" id="tab-code">
      <textarea id="live-code-editor" class="code-textarea" oninput="handleCodeInput()" spellcheck="false"></textarea>
    </div>

  </div>

  <script>
    let isUnlocked = false;
    let activeElement = null;
    let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

    // SVG Exemplo Padrão com Forma e Texto
    const initialSVG = `<svg width="100%" height="100%" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect id="box1" x="30" y="30" width="120" height="80" rx="10" fill="#38bdf8" style="position: absolute;" />
  <circle id="circle1" cx="220" cy="80" r="40" fill="#f59e0b" />
  <text id="text1" x="30" y="160" font-family="sans-serif" font-size="18" fill="#0f172a">Clique em 'Destravar' para me arrastar!</text>
</svg>`;

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('live-code-editor').value = initialSVG;
      updateCanvas(initialSVG);
      setupDragAndDrop();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    function updateCanvas(code) {
      const container = document.getElementById('rendered-view');
      container.innerHTML = code;
    }

    function handleCodeInput() {
      const code = document.getElementById('live-code-editor').value;
      updateCanvas(code);
    }

    // ALTERNA ENTRE MODO TRAVADO E DESTRAVADO (EDITÁVEL)
    function toggleCanvasLock() {
      isUnlocked = !isUnlocked;
      const canvas = document.getElementById('rendered-view');
      const btn = document.getElementById('lock-btn');

      if (isUnlocked) {
        canvas.classList.add('unlocked');
        btn.innerText = '🔓 Destravado (Arrastar)';
        btn.style.backgroundColor = 'var(--warning)';
        btn.style.color = '#000';
      } else {
        canvas.classList.remove('unlocked');
        btn.innerText = '🔒 Travado (Ver)';
        btn.style.backgroundColor = 'var(--card-bg)';
        btn.style.color = 'var(--text-main)';
      }
    }

    // LÓGICA DE ARRASTAR E SOLTAR (DRAG & DROP)
    function setupDragAndDrop() {
      const canvas = document.getElementById('rendered-view');

      canvas.addEventListener('mousedown', startDrag);
      canvas.addEventListener('touchstart', startDrag, { passive: false });

      window.addEventListener('mousemove', drag);
      window.addEventListener('touchmove', drag, { passive: false });

      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchend', endDrag);
    }

    function startDrag(e) {
      if (!isUnlocked) return;
      const target = e.target;
      if (target === document.getElementById('rendered-view') || target.tagName === 'svg') return;

      activeElement = target;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;

      // Obtém coordenadas atuais (atributos x/y de SVG ou cx/cy)
      initialLeft = parseFloat(activeElement.getAttribute('x') || activeElement.getAttribute('cx') || 0);
      initialTop = parseFloat(activeElement.getAttribute('y') || activeElement.getAttribute('cy') || 0);

      e.preventDefault();
    }

    function drag(e) {
      if (!activeElement || !isUnlocked) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - startX;
      const deltaY = clientY - startY;

      const newX = Math.round(initialLeft + deltaX);
      const newY = Math.round(initialTop + deltaY);

      // Atualiza os atributos visuais do elemento SVG
      if (activeElement.hasAttribute('cx')) {
        activeElement.setAttribute('cx', newX);
        activeElement.setAttribute('cy', newY);
      } else {
        activeElement.setAttribute('x', newX);
        activeElement.setAttribute('y', newY);
      }

      syncCanvasToCode();
      if (e.cancelable) e.preventDefault();
    }

    function endDrag() {
      activeElement = null;
    }

    // SINCRONIZA O HTML/SVG GERADO COM O PAINEL DE CÓDIGO
    function syncCanvasToCode() {
      const canvas = document.getElementById('rendered-view');
      document.getElementById('live-code-editor').value = canvas.innerHTML;
    }
  </script>
</body>
</html>
