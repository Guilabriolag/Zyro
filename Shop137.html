function constrain(){P.x=clamp(P.x,-27.3,27.3);P.z=clamp(P.z,-17,18.6);for(const c of cols){const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+.35;if(d<m&&d>0){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m}}}
function updPlayer(dt,t){if(holds.size){P.vx=P.vz=0;return}
const l=Math.hypot(IN.x,IN.z);let mv=false;
if(l>.05){mv=true;const k=Math.max(l,1),r=IN.x/k,f=IN.z/k,mx=r*Math.cos(yaw)+f*Math.sin(yaw),mz=-r*Math.sin(yaw)+f*Math.cos(yaw);P.vx=mx*5;P.vz=mz*5;pm.rotation.y=Math.atan2(mx,mz)}else{P.vx*=Math.pow(.001,dt);P.vz*=Math.pow(.001,dt)}
P.x+=P.vx*dt;P.z+=P.vz*dt;constrain();
if(IN.jump&&P.g){P.vy=6.5;P.g=false}IN.jump=false;P.vy-=18*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.g=true}
anim(pm,t,mv&&P.g,false,0);pm.position.set(P.x,P.y,P.z)}
function updCam(dt){camT.lerp(new V(P.x,P.y+1.4,P.z),1-Math.exp(-8*dt));const hd=7.5*Math.cos(pitch),vd=7.5*Math.sin(pitch);
camP.set(P.x+Math.sin(yaw)*hd,P.y+1.6+vd,P.z+Math.cos(yaw)*hd);camP.x=clamp(camP.x,-29,29);camP.z=clamp(camP.z,-19.4,19.4);camP.y=Math.min(camP.y,9.5);
cam.position.lerp(camP,1-Math.exp(-8*dt));cam.lookAt(camT)}

['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>drag=null));

{const z=$('joy'),k=$('knob');let on=null,c;const mv=(x,y)=>{let dx=x-c.x,dy=y-c.y;const m=75,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}IN.x=dx/m;IN.z=dy/m;k.style.transform=`translate(${dx}px,${dy}px)`};
