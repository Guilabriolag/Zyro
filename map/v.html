<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Biblioteca FGG Mobile</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Altura exata para telas de celulares modernos */
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      background-color: var(--panel-bg);
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Navegação por Abas (Mobile) */
    .mobile-tabs {
      display: flex;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.25rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    /* Botões Globais */
    button, .btn-label {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    button.primary {
      background-color: var(--accent);
      color: #000;
      border: none;
    }

    button.danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Conteúdo Principal (Container de Abas) */
    .main-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 1rem;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .tab-content.active {
      display: flex;
    }

    /* Lista de Arquivos (Aba 1) */
    .search-box {
      width: 100%;
      padding: 0.75rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .file-item {
      padding: 0.9rem;
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .file-item.active {
      border-color: var(--accent);
      background-color: var(--card-bg);
    }

    .file-item .title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .file-item .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    /* Visualizador (Aba 2) */
    .viewer-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    pre {
      background-color: #050811;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
      overflow-y: auto;
    }

    /* Formulário (Aba 3) */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 0.7rem;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .hidden { display: none !important; }

    /* Layout Desktop (Telas acima de 768px) */
    @media (min-width: 768px) {
      .mobile-tabs { display: none; }
      
      .main-content {
        display: grid;
        grid-template-columns: 320px 1fr 340px;
      }

      .tab-content {
        position: relative;
        display: flex !important;
        border-right: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>📁 FGG Library</h1>
    <div class="header-actions">
      <label class="btn-label">
        📥
        <input type="file" id="import-json" accept=".json" class="hidden" onchange="importLibrary(event)" />
      </label>
      <button onclick="exportLibrary()">📤</button>
    </div>
  </header>

  <!-- Navegação Mobile -->
  <nav class="mobile-tabs">
    <button class="tab-btn active" onclick="switchTab('tab-list')">📋 Lista</button>
    <button class="tab-btn" onclick="switchTab('tab-viewer')">👁️ Código</button>
    <button class="tab-btn" onclick="switchTab('tab-form')">✏️ Form</button>
  </nav>

  <!-- Área Principal -->
  <div class="main-content">
    
    <!-- ABA 1: LISTA DE ARQUIVOS -->
    <div class="tab-content active" id="tab-list">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Buscar arquivo..." oninput="renderFileList()" />
      <button class="primary" style="width: 100%; margin-top: 0.2rem;" onclick="openNewFileDialog()">+ Cadastrar Novo FGG</button>
      <div class="file-list" id="file-list"></div>
    </div>

    <!-- ABA 2: VISUALIZADOR -->
    <div class="tab-content" id="tab-viewer">
      <div class="viewer-card" id="viewer-header">Nenhum arquivo selecionado</div>
      <pre id="code-preview">// Selecione um arquivo na lista para ver os dados brutos.</pre>
    </div>

    <!-- ABA 3: FORMULÁRIO DE EDICÃO E CADASTRO -->
    <div class="tab-content" id="tab-form">
      <form id="fgg-form" onsubmit="saveFileRecord(event)" style="display: flex; flex-direction: column; gap: 0.8rem;">
        <input type="hidden" id="file-id" />
        
        <div style="background-color: var(--panel-bg); padding: 0.8rem; border-radius: 8px; border: 1px dashed var(--border); text-align: center;">
          <label style="color: var(--accent); cursor: pointer; font-size: 0.85rem; font-weight: 600;">
            📂 Carregar do celular (.FGG / .TXT)
            <input type="file" id="mobile-file-upload" class="hidden" onchange="handleFileUpload(event)" />
          </label>
        </div>

        <div class="form-group">
          <label for="file-name">Nome do Arquivo*</label>
          <input type="text" id="file-name" placeholder="ex: modelo.fgg" required />
        </div>

        <div class="form-group">
          <label for="file-category">Categoria / Tag</label>
          <input type="text" id="file-category" placeholder="ex: 3D, Terreno" />
        </div>

        <div class="form-group">
          <label for="file-size">Tamanho</label>
          <input type="text" id="file-size" placeholder="ex: 250 KB" />
        </div>

        <div class="form-group">
          <label for="file-desc">Anotações / Descrição</label>
          <textarea id="file-desc" placeholder="Detalhes do arquivo..."></textarea>
        </div>

        <div class="form-group">
          <label for="file-raw">Conteúdo do Arquivo</label>
          <textarea id="file-raw" style="font-family: monospace; font-size: 0.8rem;" placeholder="Cole o código ou JSON aqui..."></textarea>
        </div>

        <button type="submit" class="primary" style="padding: 0.8rem; font-size: 0.9rem;">💾 Salvar na Biblioteca</button>
      </form>

      <button id="delete-btn" class="danger hidden" style="margin-top: 0.5rem; padding: 0.7rem;" onclick="deleteCurrentFile()">🗑️ Excluir Registro</button>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'FGG_MOBILE_LIBRARY';
    let library = [];
    let selectedFileId = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadFromLocalStorage();
      renderFileList();
    });

    // Alternar abas no celular
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      
      const tabIndex = ['tab-list', 'tab-viewer', 'tab-form'].indexOf(tabId);
      if (tabIndex !== -1) {
        document.querySelectorAll('.tab-btn')[tabIndex].classList.add('active');
      }
    }

    // Carregar do LocalStorage
    function loadFromLocalStorage() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try { library = JSON.parse(data); } catch (e) { library = []; }
      } else {
        library = [{
          id: 'demo-mobile-1',
          name: 'exemplo_terreno.fgg',
          category: '3D Terreno',
          size: '45 KB',
          updatedAt: new Date().toLocaleDateString('pt-BR'),
          description: 'Amostra carregada no celular.',
          content: '{\n  "versao": "2.0",\n  "status": "ativo",\n  "pontos": [10, 20, 30]\n}'
        }];
        saveToLocalStorage();
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
    }

    // Renderizar Lista
    function renderFileList() {
      const container = document.getElementById('file-list');
      const query = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const filtered = library.filter(item => 
        item.name.toLowerCase().includes(query) || 
        (item.category && item.category.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 1rem;">Nenhum arquivo encontrado.</div>`;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `file-item ${item.id === selectedFileId ? 'active' : ''}`;
        div.onclick = () => selectFile(item.id);
        div.innerHTML = `
          <div class="title">${item.name}</div>
          <div class="meta">
            <span>🏷️ ${item.category || 'Geral'}</span>
            <span>📦 ${item.size || '-'}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Selecionar Arquivo
    function selectFile(id) {
      selectedFileId = id;
      const file = library.find(item => item.id === id);
      if (!file) return;

      document.getElementById('file-id').value = file.id;
      document.getElementById('file-name').value = file.name;
      document.getElementById('file-category').value = file.category || '';
      document.getElementById('file-size').value = file.size || '';
      document.getElementById('file-desc').value = file.description || '';
      document.getElementById('file-raw').value = file.content || '';

      document.getElementById('viewer-header').innerText = `${file.name} (${file.updatedAt || ''})`;
      document.getElementById('code-preview').textContent = file.content || '// Sem conteúdo gravado.';

      document.getElementById('delete-btn').classList.remove('hidden');
      renderFileList();

      // No mobile, vai direto para a tela de visualização
      if (window.innerWidth < 768) {
        switchTab('tab-viewer');
      }
    }

    // Criar Novo
    function openNewFileDialog() {
      selectedFileId = null;
      document.getElementById('fgg-form').reset();
      document.getElementById('file-id').value = '';
      document.getElementById('viewer-header').innerText = 'Novo arquivo...';
      document.getElementById('code-preview').textContent = '// Preencha o formulário.';
      document.getElementById('delete-btn').classList.add('hidden');
      renderFileList();

      if (window.innerWidth < 768) {
        switchTab('tab-form');
      }
    }

    // Salvar Registro
    function saveFileRecord(e) {
      e.preventDefault();
      const id = document.getElementById('file-id').value || 'fgg-' + Date.now();
      const record = {
        id,
        name: document.getElementById('file-name').value,
        category: document.getElementById('file-category').value,
        size: document.getElementById('file-size').value,
        description: document.getElementById('file-desc').value,
        content: document.getElementById('file-raw').value,
        updatedAt: new Date().toLocaleDateString('pt-BR')
      };

      const idx = library.findIndex(item => item.id === id);
      if (idx >= 0) library[idx] = record;
      else library.push(record);

      saveToLocalStorage();
      selectFile(id);
    }

    // Excluir
    function deleteCurrentFile() {
      if (!selectedFileId) return;
      if (confirm('Deseja excluir este arquivo FGG?')) {
        library = library.filter(item => item.id !== selectedFileId);
        saveToLocalStorage();
        openNewFileDialog();
        switchTab('tab-list');
      }
    }

    // Leitura de Arquivo Local no Celular
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('file-name').value = file.name;
        document.getElementById('file-size').value = (file.size / 1024).toFixed(1) + ' KB';
        document.getElementById('file-category').value = file.name.split('.').pop().toUpperCase();
        document.getElementById('file-raw').value = evt.target.result;
      };
      reader.readAsText(file);
    }

    // Exportar JSON
    function exportLibrary() {
      if (library.length === 0) return alert('Biblioteca vazia!');
      const blob = new Blob([JSON.stringify(library, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `fgg_backup_${Date.now()}.json`;
      a.click();
    }

    // Importar JSON
    function importLibrary(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data)) {
            library = data;
            saveToLocalStorage();
            renderFileList();
            alert('Biblioteca importada com sucesso!');
          }
        } catch (err) {
          alert('Erro ao carregar o arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
