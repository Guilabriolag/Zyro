<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZYRO · Estúdio Tic-Tac T0.5</title>
<style>
:root{--bg1:#0f1a2e;--bg2:#06090f;--fg:#e8f6ff;--ac:#5fd0a0;--gold:#f5c518;--chip:rgba(95,208,160,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1a2e;--bg2:#06090f}}
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:radial-gradient(circle at 50% 38%,var(--bg1),var(--bg2));-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;inset:0;touch-action:none}
h1{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:14px;margin:0;font:700 14px ui-monospace,monospace;letter-spacing:.16em;color:var(--ac);pointer-events:none}
h1 small{display:block;font-size:9px;color:#8995a8;letter-spacing:.08em;margin-top:3px}
button{flex:none;border:1px solid var(--ac);background:var(--chip);color:var(--fg);padding:7px 11px;border-radius:999px;font-size:13px;touch-action:manipulation}
button.on{background:var(--ac);color:#04121c;font-weight:600}
#tb{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:10px;background:var(--ac);color:#04121c;font-weight:700}
#drawer{display:none;position:absolute;top:calc(48px + env(safe-area-inset-top,0px));left:10px;right:10px;max-height:calc(100dvh - 310px);overflow:auto;padding:10px;border-radius:14px;background:rgba(8,14,24,.92);border:1px solid var(--ac)}
#tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
#tc{display:flex;flex-wrap:wrap;gap:6px}
#tc h3{flex:1 0 100%;margin:6px 0 0;font:700 11px ui-monospace,monospace;letter-spacing:.08em;color:var(--gold)}
#tc label{flex:1 0 100%;font-size:13px}#tc label output{float:right;color:var(--ac);font:11px ui-monospace,monospace}#tc input{width:100%;accent-color:var(--ac)}
#joy{position:absolute;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:var(--chip);border:2px solid var(--ac);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:56px;height:56px;border-radius:50%;background:var(--ac);opacity:.9}
#st{position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));font:10px ui-monospace,monospace;color:var(--ac);text-align:right}
#btns{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;align-items:flex-end}
#btns button{border-radius:50%;width:74px;height:74px;font-weight:700;font-size:12px;background:var(--ac);color:#04121c}
#act{width:70px!important;height:70px!important;font-size:10px!important;background:var(--gold)!important}
#ges{width:54px!important;height:54px!important;font-size:10px!important;background:#8fb3ff!important}
</style></head><body>
<h1>UNIVERSO ZERO<small>ESTÚDIO TIC-TAC · T0.5</small></h1>
<button id="tb">☰ FERRAMENTAS</button>
<div id="drawer"><div id="tabs"></div><div id="tc"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="st">PRONTO · EM PÉ</div>
<div id="btns"><button id="ges">GESTO</button><button id="act">INTERAGIR</button><button id="jump">PULAR</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),lerp=(a,b,k)=>a+(b-a)*k,st=t=>$('st').textContent=t;
/* ===== TicTacRenderer ===== */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,60);
const hemi=new THREE.HemisphereLight(0xdceeff,0x283044,1),key=new THREE.DirectionalLight(0xfff0dc,1.2);key.position.set(3,5,4);
const rim=new THREE.PointLight(0x5fd0a0,1.5,14);rim.position.set(-3,2,-3);scene.add(hemi,key,rim);
const std=(c,r=.45,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const box=(w,h,d,m,x=0,y=0,z=0)=>mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z);
const skin=std(0xf3dcc0,.42),white=std(0xfafafa,.35),black=std(0x050505,.2),sole=std(0x2a3340,.5),handMat=std(0xfafafa,.35),footMat=std(0xfafafa,.35);
const PR=3.4;
scene.add(mesh(new THREE.CylinderGeometry(PR,PR+.1,.12,64),std(0x10213a,.3,.6),0,-.06,0));
const ring=mesh(new THREE.TorusGeometry(PR-.1,.03,12,96),new THREE.MeshBasicMaterial({color:0x5fd0a0}),0,.01,0);ring.rotation.x=Math.PI/2;scene.add(ring);

/* ===== TicTacCore + BodyCustomizer ===== */
const Hh=1.02,Rm=.62,BOT=.13,BD0={hei:1,wid:1,head:.12,torso:.88,belly:.03,shape:2.8,ext:1},Bd=Object.assign({},BD0);
const G=(y,c,s)=>Math.exp(-(((y-c)/s)**2));
const rad=y=>{const u=Math.min(.9999,Math.abs(y/Hh)),b=Rm*Math.pow(1-Math.pow(u,Bd.shape),1/Bd.shape);
 return b*(Bd.torso+(1-Bd.torso)/(1+Math.exp(-4*(y-.2)/.25)))*(1+Bd.head*G(y,.75,.22)-.12*G(y,.35,.05)+Bd.belly*G(y,-.25,.3))};
const sz=(x,y)=>Math.sqrt(Math.max(.0004,rad(y)**2-x*x));
const tic=new THREE.Group();scene.add(tic);
const body=new THREE.Group();tic.add(body);
const bodyMesh=new THREE.Mesh(new THREE.BufferGeometry(),skin);body.add(bodyMesh);
let dirty=true,bv=0;
function rebuild(){const p=[];for(let i=0;i<=56;i++){const a=-Math.PI/2+Math.PI*i/56,y=Hh*Math.sin(a);p.push(new THREE.Vector2(rad(y),y))}
 bodyMesh.geometry.dispose();bodyMesh.geometry=new THREE.LatheGeometry(p,64);layoutFace();refreshWear();bv++}
/* rosto */
const EY=.72,MY=.5,sock=std(0xe2c6a0,.5),eyes=[],rings=[];
[-1,1].forEach(()=>{const g=new THREE.Group(),ball=mesh(new THREE.SphereGeometry(.115,28,20),black);ball.scale.set(1,1.25,.55);g.add(ball);
 const h1=mesh(new THREE.SphereGeometry(.032,12,8),white),h2=mesh(new THREE.SphereGeometry(.016,10,6),white);g.add(h1,h2);g.userData={h1,h2};body.add(g);eyes.push(g);
 const so=mesh(new THREE.TorusGeometry(.125,.014,8,28),sock);so.scale.set(1,1.22,1);body.add(so);rings.push(so)});
function layoutFace(){[-1,1].forEach((s,i)=>{const x=s*.2,z=sz(x,EY);eyes[i].position.set(x,EY,z-.02);rings[i].position.set(x,EY,z-.012);rings[i].rotation.y=Math.atan2(x,z)})}
const brows=[0,1].map(()=>{const b=mesh(new THREE.SphereGeometry(.1,16,8),black);b.scale.set(1.15,.17,.28);body.add(b);return b});
const mshape=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshStandardMaterial({color:0x4a0a16,roughness:.5,side:THREE.DoubleSide}));
const mrim=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshStandardMaterial({color:0x2b0710,roughness:.6,side:THREE.DoubleSide}));
const tongue=mesh(new THREE.CircleGeometry(1,20),std(0xff6f7d,.5));body.add(mrim,mshape,tongue);
function mgeo(w,ct,cb,mx,off){const s=new THREE.Shape();s.moveTo(-w,0);s.quadraticCurveTo(0,2*ct,w,0);s.quadraticCurveTo(0,2*cb,-w,0);
 const g=new THREE.ShapeGeometry(s,16),p=g.attributes.position,k=1+off,c=(ct+cb)/2;
 for(let i=0;i<p.count;i++){const px=p.getX(i),py=p.getY(i);p.setXYZ(i,px*k,(py-c)*k+c,sz(mx+px*k,MY+py)+.006-(off?.003:0))}return g}
function buildMouth(w,ct,cb,mx,tg){mshape.geometry.dispose();mrim.geometry.dispose();mshape.geometry=mgeo(w,ct,cb,mx,0);mrim.geometry=mgeo(w,ct,cb,mx,.28);
 mshape.position.set(mx,MY,0);mrim.position.set(mx,MY,0);tongue.visible=cb<-.06&&tg>.5;
 tongue.position.set(mx,MY+cb*.6,sz(mx,MY)+.011);tongue.scale.set(w*.5,Math.max(.01,-cb*.28),1)}

/* ===== MÃOS ARTICULADAS (T0.5) =====
   Convenção anatômica: hands[0] = mão DIREITA do Tic-Tac (lado -x, ele olha para +z); hands[1] = ESQUERDA (+x).
   A câmera pode girar à vontade: a identidade das mãos não muda.
   Cada mão: palma + 4 dedos (3 falanges) + polegar (2 falanges) + punho. A esquerda é o espelho exato da direita. */
const FAN=[.22,.07,-.08,-.24],FX=[.115,.04,-.035,-.105],FL=[.085,.1,.092,.072];
function chain(par,lens,r0,dr){const js=[];let prev=0;lens.forEach((len,k)=>{const r=r0-k*dr,j=new THREE.Group();j.position.y=prev;par.add(j);
 j.add(mesh(new THREE.CylinderGeometry(r*.92,r,len,10),handMat,0,len/2,0),mesh(new THREE.SphereGeometry(r*1.04,10,8),handMat,0,len,0));js.push(j);par=j;prev=len});return js}
function buildHand(s){const g=new THREE.Group(),wr=new THREE.Group(),inn=new THREE.Group();g.add(wr);wr.add(inn);
 const palm=mesh(new THREE.SphereGeometry(.2,24,16),handMat);palm.scale.set(1,1.05,.68);inn.add(palm);
 inn.add(mesh(new THREE.CylinderGeometry(.15,.15,.07,20),handMat,0,-.21,0));
 const mk=mesh(new THREE.SphereGeometry(.055,12,8),new THREE.MeshBasicMaterial({color:s<0?0xff3b3b:0x3b8bff}),0,.03,-.15);mk.visible=false;inn.add(mk);
 const fing=FX.map((x,q)=>{const F=new THREE.Group();F.position.set(x,.15,0);inn.add(F);F.userData.j=chain(F,[FL[q],FL[q]*.78,FL[q]*.6],.04,.004);return F});
 const TH=new THREE.Group();TH.position.set(.14,-.03,.05);inn.add(TH);TH.userData.j=chain(TH,[.08,.065],.044,.004);
 g.userData={wr,inn,fing,TH,mk,mx:s>0?-1:1,cur:{f:[.25,.3,.35,.4],t:[.35,.25],sp:.15}};tic.add(g);return g}
const hands=[-1,1].map(s=>buildHand(s));
const feet=[-1,1].map(()=>{const g=new THREE.Group(),inn=new THREE.Group();g.add(inn);
 const f=mesh(new THREE.SphereGeometry(.3,24,16),footMat);f.scale.set(.95,.58,1.25);inn.add(f);
 const so=mesh(new THREE.SphereGeometry(.3,20,10),sole,0,-.08,0);so.scale.set(.97,.2,1.27);inn.add(so);
 const col=mesh(new THREE.CylinderGeometry(.17,.2,.3,20),footMat,0,.22,-.08);col.visible=false;inn.add(col);
 g.userData={inner:inn,collar:col};tic.add(g);return g});
/* formas da mão: f=curvatura dos 4 dedos (0 aberto..1 fechado), t=[abertura,curvatura] do polegar, sp=abertura em leque, w=orientação do pulso */
const HG={
 Relaxada:{f:[.25,.3,.35,.4],t:[.35,.25],sp:.15,w:'rest'},
 Aberta:{f:[0,0,0,0],t:[.8,0],sp:.3,w:'up'},
 Fechada:{f:[1,1,1,1],t:[.1,1],sp:0,w:'grip'},
 Apontar:{f:[0,1,1,1],t:[.3,.85],sp:0,w:'point',an:'tap'},
 'Polegar cima':{f:[1,1,1,1],t:[1.15,0],sp:0,w:'thumbUp'},
 'Polegar baixo':{f:[1,1,1,1],t:[1.15,0],sp:0,w:'thumbDown'},
 Pinça:{f:[.5,.3,.25,.2],t:[.5,.55],sp:.1,w:'pinch'},
 Espalhada:{f:[0,0,0,0],t:[1,0],sp:1,w:'up'},
 Acenar:{f:[0,0,0,0],t:[.7,0],sp:.5,w:'up',an:'wave'},
 Digitar:{f:[.35,.45,.55,.6],t:[.3,.4],sp:.1,w:'typing',an:'type'},
 Apertar:{f:[.85,.9,.9,.9],t:[.4,.75],sp:0,w:'wheel'},
 Segurar:{f:[.7,.75,.8,.85],t:[.4,.6],sp:0,w:'grip'},
 Palma:{f:[.15,.15,.2,.25],t:[.6,.1],sp:.2,w:'tray'}};
/* orientação do pulso (mão DIREITA): [direção dos dedos, direção da palma] no referencial do corpo (+x esquerda, +y cima, +z frente). A esquerda é espelhada. */
const WR={rest:[[0,-1,0],[1,0,0]],up:[[0,1,0],[0,0,1]],point:[[0,0,1],[0,-1,0]],typing:[[0,.3,1],[0,-1,.3]],grip:[[0,0,1],[1,0,0]],
 thumbUp:[[0,0,1],[1,0,0]],thumbDown:[[0,0,1],[-1,0,0]],pinch:[[0,.6,.8],[1,0,0]],wheel:[[0,.85,.5],[1,0,0]],tray:[[0,0,1],[0,1,0]],
 ear:[[0,1,0],[1,0,0]],tapDown:[[0,-1,.3],[0,0,-1]]};
const _f=new THREE.Vector3(),_p=new THREE.Vector3(),_x=new THREE.Vector3(),_M=new THREE.Matrix4(),_qa=new THREE.Quaternion(),ZAX=new THREE.Vector3(0,0,1),qT=new THREE.Quaternion(),wp=new THREE.Vector3();
function wristQ(n,left,out){const w=WR[n]||WR.rest;_f.set(w[0][0],w[0][1],w[0][2]);_p.set(w[1][0],w[1][1],w[1][2]);if(left){_f.x=-_f.x;_p.x=-_p.x}
 _f.normalize();_p.addScaledVector(_f,-_p.dot(_f)).normalize();_x.crossVectors(_f,_p);_M.makeBasis(_x,_f,_p);return out.setFromRotationMatrix(_M)}
function poseHand(hd,tg,dt,tt,anim,on){const u=hd.userData,c=u.cur,k=Math.min(1,dt*16);
 for(let q=0;q<4;q++)c.f[q]+=(tg.f[q]-c.f[q])*k;
 c.t[0]+=(tg.t[0]-c.t[0])*k;c.t[1]+=(tg.t[1]-c.t[1])*k;c.sp+=(tg.sp-c.sp)*k;
 u.fing.forEach((F,q)=>{let cv=c.f[q];
  if(on&&anim==='type')cv+=Math.max(0,Math.sin(tt*22+q*1.9))*.35;
  if(on&&anim==='tap'&&q===0)cv=.15+Math.max(0,Math.sin(tt*18))*.55;
  F.rotation.z=-FAN[q]*c.sp;const j=F.userData.j;j[0].rotation.x=cv*1.35;j[1].rotation.x=cv*1.5;j[2].rotation.x=cv*.95});
 const sp=c.t[0],cu=c.t[1],th=u.TH;th.rotation.set(.2+cu*.7,0,-(.25+.7*sp)*(1-cu*.8));th.userData.j[0].rotation.x=cu*.35;th.userData.j[1].rotation.x=cu*.9}
/* ===== AttachmentPoints ===== */
const dots=new THREE.Group();dots.visible=false;tic.add(dots);
const dotM=new THREE.MeshBasicMaterial({color:0x22d3ee,depthTest:false});
const sockets=[0,1,2,3,4,5].map(()=>{const d=mesh(new THREE.SphereGeometry(.06,10,8),dotM);d.renderOrder=9;dots.add(d);return d});

/* ===== AccessoryLibrary ===== */
const wearG={head:new THREE.Group(),torso:new THREE.Group(),back:new THREE.Group()};
wearG.head.position.y=.95;wearG.back.position.y=.05;Object.values(wearG).forEach(g=>body.add(g));
const sh=(y0,y1,off,col,r=.55)=>{const p=[];for(let i=0;i<=24;i++){const y=y0+(y1-y0)*i/24;p.push(new THREE.Vector2(rad(y)+off,y))}
 const m=std(col,r);m.side=THREE.DoubleSide;return mesh(new THREE.LatheGeometry(p,48),m)};
const hat=f=>{const g=new THREE.Group();f(g);g.scale.setScalar(.82);return [g]};
const dome=(c,r=.56)=>mesh(new THREE.SphereGeometry(r,32,16,0,Math.PI*2,0,Math.PI/2),std(c,.35));
const LIB={
 head:{
  'Capacete':()=>hat(g=>{const y=std(0xf5c400,.3),b=mesh(new THREE.CylinderGeometry(.6,.6,.04,32),y,0,0,.1);b.scale.z=1.25;g.add(dome(0xf5c400),b,box(.12,.08,.9,y,0,.55,0))}),
  'Chef':()=>hat(g=>g.add(mesh(new THREE.CylinderGeometry(.45,.45,.45,32),white,0,.2,0),mesh(new THREE.SphereGeometry(.55,24,16),white,0,.65,0))),
  'Boné':()=>hat(g=>{const r=std(0xd81f26,.4),b=mesh(new THREE.SphereGeometry(.5,24,8,0,Math.PI*2,0,Math.PI/2),r,0,.02,.4);b.scale.set(.8,.14,.8);g.add(dome(0xd81f26),b)}),
  'Quepe':()=>hat(g=>{const n=std(0x14223f,.5),v=mesh(new THREE.SphereGeometry(.5,24,8,0,Math.PI*2,0,Math.PI/2),black,0,0,.42);v.scale.set(.85,.14,.8);
   g.add(mesh(new THREE.CylinderGeometry(.5,.58,.3,32),n,0,.15,0),mesh(new THREE.CylinderGeometry(.62,.58,.07,32),n,0,.32,.04),v,mesh(new THREE.CircleGeometry(.07,16),std(0xf5c400,.3,.8),0,.18,.585))}),
  'Touca':()=>{const s=sh(.97,Hh+.01,.03,0xf5c400);s.position.y=-.95;return [s]}},
 torso:{
  'Colete policial':()=>{const a=[sh(-.5,.3,.07,0x141a2a),sh(-.56,-.42,.09,0x0a0c10)];
   [-1,1].forEach(s=>a.push(box(.2,.24,.08,std(0x232b3f,.6),s*.17,.02,sz(s*.17,.02)+.09)));
   a.push(mesh(new THREE.CircleGeometry(.05,16),std(0xf5c400,.3,.8),.2,.17,sz(.2,.17)+.125));return a},
  'Colete refletivo':()=>[sh(-.5,.3,.05,0xff7a00),sh(-.2,-.1,.065,0xcfd4da,.3),sh(.05,.15,.065,0xcfd4da,.3)],
  'Avental':()=>[sh(-.7,.28,.035,0xffffff),box(.3,.16,.05,std(0xeeeeee),0,-.3,sz(0,-.3)+.06)],
  'Uniforme azul':()=>[sh(-.7,.3,.03,0x2d5da8),sh(-.5,-.42,.045,0x222222)],
  'Macacão cinza':()=>[sh(-.8,.3,.03,0x6b7684),box(.22,.2,.05,std(0x59636f),.17,-.1,sz(.17,-.1)+.05)],
  'Camiseta':()=>[sh(-.4,.3,.025,0x2e9d5b)],
  'Sunga':()=>[sh(-.8,-.3,.03,0xe0322b)]},
 back:{
  'Mochila entregador':()=>{const z=-(rad(0)+.22),r=std(0xd81f26,.6);return [box(.62,.7,.36,r,0,0,z),box(.5,.1,.38,std(0xf5c400),0,.2,z)]},
  'Mochila escolar':()=>{const z=-(rad(0)+.18);return [box(.5,.6,.3,std(0x2e9d5b,.6),0,0,z)]}},
 hands:{'Brancas':0xfafafa,'Amarelas':0xf5c400,'Pretas':0x1a1a1a,'Vermelhas':0xd22b2b,'Couro':0xb8864b},
 feet:{'Brancos':[0xfafafa,0],'Tênis vermelho':[0xd22b2b,0],'Botas amarelas':[0xf5c400,1],'Botas pretas':[0x1b1b1b,1]}};
const WEAR={head:null,torso:null,back:null,hands:'Brancas',feet:'Brancos'};
const PRE={Pelado:{head:null,torso:null,back:null,hands:'Brancas',feet:'Brancos'},
 Policial:{head:'Quepe',torso:'Colete policial',back:null,hands:'Pretas',feet:'Botas pretas'},
 Nadador:{head:'Touca',torso:'Sunga',back:null,hands:'Brancas',feet:'Brancos'},
 Cozinheiro:{head:'Chef',torso:'Avental',back:null,hands:'Brancas',feet:'Brancos'},
 Entregador:{head:'Boné',torso:'Uniforme azul',back:'Mochila entregador',hands:'Brancas',feet:'Tênis vermelho'},
 Mecânico:{head:'Capacete',torso:'Macacão cinza',back:null,hands:'Couro',feet:'Botas pretas'}};
const OXT={'Colete policial':.08,'Colete refletivo':.05,'Avental':.04,'Uniforme azul':.04,'Macacão cinza':.04,'Camiseta':.03,'Sunga':.03};
function refreshWear(){['head','torso','back'].forEach(c=>{const g=wearG[c];g.children.slice().forEach(o=>g.remove(o));if(WEAR[c])LIB[c][WEAR[c]]().forEach(o=>g.add(o))});
 handMat.color.set(LIB.hands[WEAR.hands]);const f=LIB.feet[WEAR.feet];footMat.color.set(f[0]);feet.forEach(x=>x.userData.collar.visible=!!f[1])}
function setWear(c,n){WEAR[c]=(WEAR[c]===n&&LIB[c]&&!['hands','feet'].includes(c))?null:n;refreshWear();show(curTab)}
/* objetos seguráveis (ficam na mão DIREITA) */
const dk=std(0x1a1f2a,.4),HELD={},mkH={
 phone:()=>{const g=new THREE.Group(),scm=new THREE.MeshBasicMaterial({color:0x6fe0ff});g.add(box(.13,.24,.02,dk),mesh(new THREE.PlaneGeometry(.1,.2),scm,0,0,.0115));
  const p2=mesh(new THREE.PlaneGeometry(.1,.2),scm,0,0,-.0115);p2.rotation.y=Math.PI;g.add(p2);return g},
 cup:()=>mesh(new THREE.CylinderGeometry(.07,.055,.14,16),std(0x9fd8ff,.2)),
 apple:()=>mesh(new THREE.SphereGeometry(.08,16,12),std(0xd62828,.4)),
 wrench:()=>{const g=new THREE.Group(),m=std(0xaab4c0,.3,.8);g.add(box(.05,.34,.03,m),mesh(new THREE.TorusGeometry(.06,.02,8,16),m,0,.19,0));return g},
 tray:()=>mesh(new THREE.CylinderGeometry(.4,.4,.03,28),std(0xcfd6de,.3,.7)),
