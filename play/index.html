<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>ZYRO — Complexo</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- =========================================================
       CASCA PRINCIPAL
       ========================================================= -->

  <div id="zyro-app">

    <!-- =======================================================
         ÁREA DO JOGO
         O game.js cria o canvas do Three.js aqui.
         ======================================================= -->

    <main id="game-shell">

      <!-- =====================================================
           HUD SUPERIOR
           ===================================================== -->

      <header id="game-hud">

        <div class="hud-brand">
          <span class="brand-main">ZYRO</span>
          <span class="brand-sub">COMPLEXO</span>
        </div>

        <div class="hud-status">
          <span id="player-name">PLAYER</span>
          <span id="player-state">ONLINE</span>
        </div>

      </header>


      <!-- =====================================================
           BOTÃO DE MENU
           ===================================================== -->

      <button
        id="menu-button"
        class="hud-button"
        type="button"
        aria-label="Abrir menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- =====================================================
           HUD DE INTERAÇÃO
           ===================================================== -->

      <div id="interaction-hud">

        <div id="interaction-target">

          <span id="interaction-icon">•</span>

          <div>

            <strong id="interaction-title">
              Nada por perto
            </strong>

            <small id="interaction-description">
              Explore o complexo
            </small>

          </div>

        </div>

      </div>


      <!-- =====================================================
           JOYSTICK
           IDs compatíveis com game.js
           ===================================================== -->

      <div id="joy-zone">

        <div id="joy-base">

          <div id="joy-knob"></div>

        </div>

      </div>


      <!-- =====================================================
           BOTÃO DE PULO
           ===================================================== -->

      <button
        id="jump-btn"
        class="action-button jump-button"
        type="button"
        aria-label="Pular"
      >
        <span class="action-icon">↑</span>
        <span>Pular</span>
      </button>


      <!-- =====================================================
           BOTÃO DE INTERAÇÃO
           ID compatível com game.js
           ===================================================== -->

      <button
        id="action-btn"
        class="action-button"
        type="button"
      >
        <span class="action-icon">↗</span>
        <span>Interagir</span>
      </button>


      <!-- =====================================================
           BOTÃO DE PAUSE
           ===================================================== -->

      <button
        id="pause-button"
        class="small-action-button"
        type="button"
      >
        II
      </button>


      <!-- =====================================================
           TELA DE PAUSE
           ===================================================== -->

      <section
        id="pause-screen"
        class="overlay-screen hidden"
      >

        <div class="overlay-panel">

          <div class="overlay-header">

            <span class="overlay-kicker">
              ZYRO
            </span>

            <h1>
              PAUSADO
            </h1>

          </div>


          <div class="pause-actions">

            <button
              id="resume-button"
              class="menu-action primary"
              type="button"
            >
              Continuar
            </button>

            <button
              id="character-button"
              class="menu-action"
              type="button"
            >
              Personagem
            </button>

            <button
              id="inventory-button"
              class="menu-action"
              type="button"
            >
              Inventário
            </button>

            <button
              id="settings-button"
              class="menu-action"
              type="button"
            >
              Configurações
            </button>

          </div>

        </div>

      </section>


      <!-- =====================================================
           PAINEL DO PERSONAGEM
           ===================================================== -->

      <section
        id="player-panel"
        class="side-panel hidden"
      >

        <div class="side-panel-header">

          <div>

            <span class="panel-kicker">
              PLAYER
            </span>

            <h2>
              Meu personagem
            </h2>

          </div>

          <button
            id="close-player-panel"
            class="close-button"
            type="button"
          >
            ×
          </button>

        </div>


        <div class="character-preview">

          <div
            id="character-preview-model"
            class="character-placeholder"
          >
            PLAYER
          </div>

        </div>


        <div class="character-info">

          <div class="info-row">

            <span>Nome</span>

            <strong id="character-name">
              Player
            </strong>

          </div>


          <div class="info-row">

            <span>Estado</span>

            <strong id="character-status">
              Normal
            </strong>

          </div>


          <div class="info-row">

            <span>Posição</span>

            <strong id="character-position">
              0 / 0
            </strong>

          </div>

        </div>

      </section>


      <!-- =====================================================
           MENU PRINCIPAL
           ===================================================== -->

      <section
        id="main-menu"
        class="side-panel hidden"
      >

        <div class="side-panel-header">

          <div>

            <span class="panel-kicker">
              ZYRO
            </span>

            <h2>
              Menu
            </h2>

          </div>

          <button
            id="close-main-menu"
            class="close-button"
            type="button"
          >
            ×
          </button>

        </div>


        <div class="menu-list">

          <button
            class="menu-action primary"
            type="button"
            data-menu="continue"
          >
            Continuar
          </button>

          <button
            class="menu-action"
            type="button"
            data-menu="character"
          >
            Personagem
          </button>

          <button
            class="menu-action"
            type="button"
            data-menu="inventory"
          >
            Inventário
          </button>

          <button
            class="menu-action"
            type="button"
            data-menu="settings"
          >
            Configurações
          </button>

        </div>

      </section>


      <!-- =====================================================
           TOAST
           ===================================================== -->

      <div
        id="event-toast"
        aria-live="polite"
      ></div>


      <!-- =====================================================
           LOADING
           ===================================================== -->

      <div id="loading-screen">

        <div class="loading-content">

          <div class="loading-logo">
            ZYRO
          </div>

          <div class="loading-line">

            <span id="loading-progress"></span>

          </div>

          <div id="loading-text">
            Inicializando complexo...
          </div>

        </div>

      </div>

    </main>

  </div>


  <!-- =========================================================
       THREE.JS
       Deve carregar ANTES do game.js
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
  </script>


  <!-- =========================================================
       WORLD
       ========================================================= -->

  <script
    src="./js/world.js">
  </script>


  <!-- =========================================================
       GAME
       ========================================================= -->

  <script
    src="./js/game.js">
  </script>


</body>
</html>
