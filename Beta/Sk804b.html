<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO 3D - Pista Dupla Paralela v10</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0b0c10; font-family:'Segoe UI',sans-serif; }
  #info {
    position:absolute; top:10px; left:10px; z-index:10;
    color:#66fcf1; font-size:13px; background:rgba(15,15,26,0.85);
    padding:10px 14px; border-radius:6px; border:1px solid rgba(102,252,241,0.4);
    max-width: 380px; line-height: 1.4;
  }
</style>
</head>
<body>
<div id="info">
  🛹 <b>ZYRO 3D v10 — Pista Dupla Paralela</b><br>
  • Pista 1 (Z=0): Platô elevado com 45° curva + Mini-ramp<br>
  • Pista 2 (Z=8): Extensão com 45° curva até o platô + Mini-ramp integrado<br>
  <span style="color:#aaa; font-size:11px;">Arraste para girar | Scroll para zoom</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde2);
scene.fog = new THREE.Fog(0xd7dde2, 50, 120);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(22, 18, 38);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(10, 2, 4);
controls.enableDamping = true;

const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(-15, 25, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const concreteMat = new THREE.MeshStandardMaterial({ color: 0xc7c2b6, roughness: 0.9 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, metalness: 0.5, roughness: 0.4 });
const grassMat = new THREE.MeshStandardMaterial({ color: 0x7a9b5c });

const grass = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), grassMat);
grass.rotation.x = -Math.PI/2;
grass.receiveShadow = true;
scene.add(grass);

const RAMP_WIDTH = 6;
const THICK = 0.3;

function segment(x1, y1, z1, x2, y2, z2, width = RAMP_WIDTH, isTransverse = false){
  const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
  const len = Math.hypot(dx, dy, dz);
  const geo = new THREE.BoxGeometry(isTransverse ? width : len, THICK, isTransverse ? len : width);
  const mesh = new THREE.Mesh(geo, concreteMat);
  mesh.position.set((x1+x2)/2, (y1+y2)/2, (z1+z2)/2);

  if(!isTransverse) {
    mesh.rotation.z = Math.atan2(dy, dx);
  } else {
    mesh.rotation.x = -Math.atan2(dy, dz);
  }

  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function curveUp(x0, y0, radius, angleDeg, z, dirX, segs = 14, width = RAMP_WIDTH){
  const pts = [];
  const totalAngle = angleDeg * Math.PI / 180;

  for(let i=0; i<=segs; i++){
    const t = (i/segs) * totalAngle;
    const px = x0 + dirX * radius * Math.sin(t);
    const py = y0 + radius * (1 - Math.cos(t));
    pts.push([px, py]);
  }

  for(let i=0; i<segs; i++){
    segment(pts[i][0], pts[i][1], z, pts[i+1][0], pts[i+1][1], z, width);
  }
  return pts[segs];
}

function longRail(xCenter, yTop, z, length){
  const g = new THREE.Group();
  const barHeight = 0.42;
  [-length/2, length/2].forEach(xOff => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035, barHeight, 8), metalMat);
    post.position.set(xOff, barHeight/2, 0);
    post.castShadow = true;
    g.add(post);
  });
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03, length, 8), metalMat);
  bar.rotation.z = Math.PI/2;
  bar.position.set(0, barHeight, 0);
  bar.castShadow = true;
  g.add(bar);
  g.position.set(xCenter, yTop, z);
  scene.add(g);
}

// ==========================================
// ---------- PISTA 1 (Z = 0) - ELEVADA ----------
// ==========================================
const Z1 = 0;
const run1 = 1.6;
const hipHeight1 = 1.4;
const topFlat = 2.0;

const xUpStart1 = -topFlat/2 - run1;   
const xUpEnd1   = -topFlat/2;         
const xDownStart1 = topFlat/2;        
const xDownEnd1  = topFlat/2 + run1;   

segment(xUpStart1, 0, Z1, xUpEnd1, hipHeight1, Z1);
segment(xUpEnd1, hipHeight1, Z1, xDownStart1, hipHeight1, Z1);
segment(xDownStart1, hipHeight1, Z1, xDownEnd1, 0, Z1);
longRail(0, hipHeight1 + THICK/2, Z1, topFlat + 0.4);

const GAP = 3.5;
const xQuarterBase1 = xUpStart1 - GAP;
segment(xUpStart1, 0, Z1, xQuarterBase1, 0, Z1);

const radius1 = 3.5;
for(let i=0; i<12; i++){
  const t1 = (i/12) * (Math.PI/2);
  const t2 = ((i+1)/12) * (Math.PI/2);
  const px1 = xQuarterBase1 - radius1 * Math.sin(t1);
  const py1 = radius1 * (1 - Math.cos(t1));
  const px2 = xQuarterBase1 - radius1 * Math.sin(t2);
  const py2 = radius1 * (1 - Math.cos(t2));
  segment(px1, py1, Z1, px2, py2, Z1);
}
segment(xQuarterBase1 - radius1, radius1, Z1, xQuarterBase1 - radius1 - 4.0, radius1, Z1);

const xRampBase1 = xDownEnd1 + GAP;
segment(xDownEnd1, 0, Z1, xRampBase1, 0, Z1);

const ramp45Height1 = 3.2; 
const topCurve1 = curveUp(xRampBase1, 0, ramp45Height1, 45, Z1, 1, 14, RAMP_WIDTH);

const plateau45Length = 2.5;
const xPlateau45End1 = topCurve1[0] + plateau45Length;
segment(topCurve1[0], topCurve1[1], Z1, xPlateau45End1, topCurve1[1], Z1);

const miniRampRadius = 3.2;
const flatBottomLength = 3.5;

const xWall1_Base = xPlateau45End1 + miniRampRadius;
curveUp(xWall1_Base, 0, miniRampRadius, 95, Z1, -1, 14, RAMP_WIDTH);

const xWall2_Base = xWall1_Base + flatBottomLength;
segment(xWall1_Base, 0, Z1, xWall2_Base, 0, Z1);
let topWall2 = curveUp(xWall2_Base, 0, miniRampRadius, 95, Z1, 1, 14, RAMP_WIDTH);
segment(topWall2[0], topWall2[1], Z1, topWall2[0] + 3.0, topWall2[1], Z1);


// ===================================================
// ---------- PISTA 2 (Z = 8) - FLUXO CONTINUO ----------
// ===================================================
const Z2 = 8;
const hipHeight2 = 1.0;

// Entrada da 45° curva na descida/início
const topCurveStart2 = curveUp(xQuarterBase1 - radius1, radius1, 3.2, 45, Z2, 1, 14, RAMP_WIDTH);
segment(xQuarterBase1 - radius1 - 3.0, radius1, Z2, topCurveStart2[0], radius1, Z2);

// Caixote Central Pista 2
segment(xUpStart1, 0, Z2, xUpEnd1, hipHeight2, Z2);
segment(xUpEnd1, hipHeight2, Z2, xDownStart1, hipHeight2, Z2);
segment(xDownStart1, hipHeight2, Z2, xDownEnd1, 0, Z2);
longRail(0, hipHeight2 + THICK/2, Z2, topFlat + 0.4);

// Extensão após o caixote
const xExtendStart2 = xDownEnd1;
const xExtendEnd2 = xRampBase1 + 4.0;
segment(xExtendStart2, 0, Z2, xExtendEnd2, 0, Z2);

// 45° Curva subindo até a altura do platô
const topCurveEnd2 = curveUp(xExtendEnd2, 0, miniRampRadius, 45, Z2, 1, 14, RAMP_WIDTH);

// Platô intermediário conectando a subida da 45° curva ao Mini-ramp
const xPlateauEnd2 = topCurveEnd2[0] + 2.5;
segment(topCurveEnd2[0], topCurveEnd2[1], Z2, xPlateauEnd2, topCurveEnd2[1], Z2);

// Mini-ramp acoplado no final da Pista 2
const xP2_Wall1_Base = xPlateauEnd2 + miniRampRadius;
curveUp(xP2_Wall1_Base, 0, miniRampRadius, 95, Z2, -1, 14, RAMP_WIDTH);

const xP2_Wall2_Base = xP2_Wall1_Base + flatBottomLength;
segment(xP2_Wall1_Base, 0, Z2, xP2_Wall2_Base, 0, Z2);
let topP2Wall2 = curveUp(xP2_Wall2_Base, 0, miniRampRadius, 95, Z2, 1, 14, RAMP_WIDTH);
segment(topP2Wall2[0], topP2Wall2[1], Z2, topP2Wall2[0] + 3.0, topP2Wall2[1], Z2);


// ---------- CENÁRIO ----------
function lampPost(px, pz){
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,5.5,8), new THREE.MeshStandardMaterial({color:0x333333, metalness:0.4}));
  pole.position.set(px, 2.75, pz);
  pole.castShadow = true;
  scene.add(pole);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,10,10), new THREE.MeshStandardMaterial({color:0xfff3c4, emissive:0xfff3c4, emissiveIntensity:0.25}));
  head.position.set(px, 5.4, pz);
  scene.add(head);
}
[[-14,-8],[30,-8],[-14,16],[30,16]].forEach(pp => lampPost(pp[0], pp[1]));

function arvore(px, pz){
  const g = new THREE.Group();
  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,2,8), new THREE.MeshStandardMaterial({color:0x5a3d2b}));
  tronco.position.y = 1; tronco.castShadow = true;
  const copa = new THREE.Mesh(new THREE.SphereGeometry(1.6,10,10), new THREE.MeshStandardMaterial({color:0x3a7a45}));
  copa.position.y = 2.8; copa.castShadow = true;
  g.add(tronco, copa);
  g.position.set(px,0,pz);
  scene.add(g);
}
[[-20,-12],[34,-12],[-20,20],[34,20],[0,-14],[0,22]].forEach(pp => arvore(pp[0], pp[1]));

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
