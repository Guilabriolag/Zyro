<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYRO 3D — Barbearia do Carlão</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0b0c10; font-family:'Segoe UI',sans-serif; }
  #info {
    position:absolute; top:10px; left:10px; z-index:10;
    color:#eef1f3; font-size:13px; background:rgba(28,37,48,0.85);
    padding:10px 16px; border-radius:6px; border:1px solid rgba(185,119,47,0.4);
    max-width: 320px;
  }
  #info strong { color: #b9772f; }
</style>
</head>
<body>
<div id="info">
  💈 <strong>Barbearia do Carlão (3D)</strong><br>
  Instância de Interior | Arraste para girar, scroll para zoom.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- CENA & CONFIGURAÇÕES ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde2);
scene.fog = new THREE.Fog(0xd7dde2, 20, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 4, 10);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;

// ---------- ILUMINAÇÃO ----------
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const warmLight = new THREE.PointLight(0xffedd3, 1.2, 15);
warmLight.position.set(0, 4.5, 0);
warmLight.castShadow = true;
warmLight.shadow.mapSize.set(1024, 1024);
scene.add(warmLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.4);
sunLight.position.set(5, 10, 7);
scene.add(sunLight);

// ---------- MATERIAIS ----------
const floorMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.4 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0xefedf0, roughness: 0.9 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.7 });
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, metalness: 0.8, roughness: 0.2 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xaaccff, metalness: 0.9, roughness: 0.1 });
const poleRed = new THREE.MeshStandardMaterial({ color: 0xbb2222 });
const poleWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });

// ---------- SALA /ESTRUTURA ----------
const ROOM_W = 8, ROOM_H = 4.5, ROOM_D = 8;

// Piso
const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.2, ROOM_D), floorMat);
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

// Parede do Fundo
const backWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, ROOM_H, 0.2), wallMat);
backWall.position.set(0, ROOM_H/2, -ROOM_D/2);
backWall.receiveShadow = true;
scene.add(backWall);

// Parede Esquerda
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, ROOM_H, ROOM_D), wallMat);
leftWall.position.set(-ROOM_W/2, ROOM_H/2, 0);
leftWall.receiveShadow = true;
scene.add(leftWall);

// ---------- MOBÍLIA DA BARBEARIA ----------

// 1. Bancada de Madeira (Fundo)
const counter = new THREE.Mesh(new THREE.BoxGeometry(5, 1.1, 0.9), woodMat);
counter.position.set(0, 0.55, -ROOM_D/2 + 0.65);
counter.castShadow = true; counter.receiveShadow = true;
scene.add(counter);

// 2. Espelho Grande na Parede
const mirrorFrame = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.2, 0.08), woodMat);
mirrorFrame.position.set(0, 2.5, -ROOM_D/2 + 0.15);
scene.add(mirrorFrame);

const mirrorGlass = new THREE.Mesh(new THREE.BoxGeometry(4.0, 2.0, 0.02), mirrorMat);
mirrorGlass.position.set(0, 2.5, -ROOM_D/2 + 0.2);
scene.add(mirrorGlass);

// 3. Cadeira de Barbeiro Central
function createBarberChair(x, z) {
  const g = new THREE.Group();

  // Base circular metálica
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.1, 16), metalMat);
  base.position.y = 0.05;
  base.castShadow = true; g.add(base);

  // Eixo Central
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 16), metalMat);
  pole.position.y = 0.35;
  pole.castShadow = true; g.add(pole);

  // Assento
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.9), leatherMat);
  seat.position.y = 0.75;
  seat.castShadow = true; g.add(seat);

  // Encosto
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 0.18), leatherMat);
  back.position.set(0, 1.25, -0.38);
  back.castShadow = true; g.add(back);

  // Apoio de Cabeça
  const headrest = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.12), leatherMat);
  headrest.position.set(0, 1.8, -0.38);
  headrest.castShadow = true; g.add(headrest);

  // Apoio para os Braços
  [-0.48, 0.48].forEach(xOff => {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.7), leatherMat);
    arm.position.set(xOff, 0.95, 0);
    arm.castShadow = true; g.add(arm);
  });

  // Apoio para os Pés
  const footrest = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.4), metalMat);
  footrest.position.set(0, 0.3, 0.55);
  footrest.castShadow = true; g.add(footrest);

  g.position.set(x, 0, z);
  scene.add(g);
}
createBarberChair(0, -1.8);

// 4. Pole Tradicional de Barbeiro (Barber Pole)
function createBarberPole(x, y, z) {
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 16), poleWhite);
  g.add(glass);

  const topCap = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), metalMat);
  topCap.position.y = 0.45; g.add(topCap);

  const botCap = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 16), metalMat);
  botCap.position.y = -0.45; g.add(botCap);

  // Faixa Vermelha Espiralizada (Anel)
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.152, 0.152, 0.25, 16), poleRed);
  stripe.position.y = 0.1; g.add(stripe);

  g.position.set(x, y, z);
  scene.add(g);
}
createBarberPole(-1.8, 2.6, -ROOM_D/2 + 0.3);

// ---------- RENDER LOOP & RESIZE ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
